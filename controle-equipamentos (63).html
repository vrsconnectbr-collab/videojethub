<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Solicitações de Equipamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#F5F4F0; --surface:#FFFFFF; --ink:#1B1F27; --ink-soft:#5B6270;
    --line:#E2E0D9; --line-strong:#CFCCC2;
    --accent:#2454FF; --accent-ink:#0E2E9E; --accent-soft:#E7EDFF;
    --success:#177B45; --success-soft:#E3F4EA;
    --danger:#C0392B; --danger-soft:#FBEAE7;
    --warn:#B5790A; --warn-soft:#FBF0DD;
    --novo:#5B6270; --novo-soft:#ECEBE7;
    --pri-baixa:#5B6270;   --pri-baixa-soft:#ECEBE7;
    --pri-media:#2454FF;   --pri-media-soft:#E7EDFF;
    --pri-alta:#D9730D;    --pri-alta-soft:#FCEEDD;
    --pri-urgente:#C0392B; --pri-urgente-soft:#FBEAE7;
    --peca:#7A5AF8; --peca-soft:#EEEAFE;
    --radius:10px; --radius-lg:16px;
    --shadow:0 1px 2px rgba(27,31,39,.06), 0 8px 24px -12px rgba(27,31,39,.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  #app{display:flex;flex-direction:column;min-height:100vh;}

  /* ---------- LOGIN ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 500px at 50% -10%, #23305a 0%, var(--ink) 55%);}
  .login-card{background:var(--surface);border-radius:18px;width:100%;max-width:380px;padding:34px 30px 28px;box-shadow:0 30px 70px -25px rgba(0,0,0,.55);}
  .login-card .logo{height:26px;margin-bottom:22px;filter:invert(1) brightness(.2);}
  .login-card h1{font-size:19px;margin:0 0 4px;font-weight:700;}
  .login-card p{margin:0 0 22px;color:var(--ink-soft);font-size:13px;}
  .login-card label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin:0 0 6px;}
  .login-card input{width:100%;border:1.5px solid var(--line-strong);border-radius:9px;padding:11px 12px;font-family:'Inter',sans-serif;font-size:14px;margin-bottom:14px;}
  .login-card input:focus{outline:none;border-color:var(--accent);}
  .login-err{color:var(--danger);font-size:12.5px;font-weight:600;margin:-6px 0 12px;min-height:16px;}
  .login-hint{font-size:11px;color:var(--ink-soft);margin-top:14px;text-align:center;line-height:1.5;}

  /* ---------- TOPO ---------- */
  .topbar{background:var(--ink);color:#fff;display:flex;align-items:center;gap:16px;padding:11px 22px;position:sticky;top:0;z-index:30;flex-wrap:wrap;}
  .topbar .logo{height:26px;width:auto;display:block;flex-shrink:0;}
  .topbar .brand-h{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;line-height:1;}
  .topbar .divider{width:1px;height:24px;background:rgba(255,255,255,.16);}
  .nav{display:flex;gap:6px;}
  .nav-btn{background:none;border:none;color:#C7CBD6;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s,color .15s;}
  .nav-btn:hover{background:rgba(255,255,255,.07);color:#fff;}
  .nav-btn.active{background:var(--accent);color:#fff;}
  .nav-btn .count{font-family:'JetBrains Mono',monospace;font-size:11px;background:rgba(255,255,255,.14);padding:1px 7px;border-radius:99px;}
  .nav-btn.active .count{background:rgba(255,255,255,.25);}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .top-icon{background:rgba(255,255,255,.08);border:none;color:#C7CBD6;height:34px;padding:0 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;position:relative;}
  .top-icon:hover{background:rgba(255,255,255,.16);color:#fff;}
  .top-icon svg{width:15px;height:15px;}
  .top-user{font-size:12px;color:#C7CBD6;display:inline-flex;align-items:center;gap:7px;background:none;border:none;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;padding:6px 4px;border-radius:6px;}
  .top-user:hover{color:#fff;background:rgba(255,255,255,.08);}
  .noti-badge{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:800;min-width:16px;height:16px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-family:'JetBrains Mono',monospace;}
  .sync-dot{width:8px;height:8px;border-radius:99px;background:#7a8091;flex-shrink:0;}
  .sync-dot.syncing{background:var(--warn);animation:syncPulse 1s ease-in-out infinite;}
  .sync-dot.ok{background:#3ddc84;}
  .sync-dot.error{background:var(--danger);}
  @keyframes syncPulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .main{flex:1;min-width:0;padding:18px 22px;width:100%;}
  .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .controls .page-label{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;white-space:nowrap;margin-right:2px;}
  .controls .spacer{flex:1 1 8px;}
  .seg{display:inline-flex;background:var(--novo-soft);border-radius:8px;padding:3px;gap:2px;}
  .seg button{border:none;background:none;font-family:'Inter',sans-serif;font-weight:600;font-size:12px;color:var(--ink-soft);padding:6px 12px;border-radius:6px;cursor:pointer;}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .ctrl{border:1.5px solid var(--line-strong);border-radius:8px;padding:7px 9px;font-size:12px;font-family:'Inter',sans-serif;background:#fff;color:var(--ink);}
  .ctrl:focus{outline:none;border-color:var(--accent);}
  input.ctrl-search{flex:0 1 200px;min-width:130px;}
  .filter-clear{background:none;border:none;color:var(--ink-soft);font-size:12px;font-weight:600;cursor:pointer;text-decoration:underline;white-space:nowrap;}
  .filter-clear:hover{color:var(--danger);}

  .btn{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;border-radius:8px;border:1px solid transparent;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .08s ease,background .15s;white-space:nowrap;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-ink);}
  .btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line-strong);}
  .btn-ghost:hover{border-color:var(--ink);}
  .btn-sm{padding:7px 11px;font-size:12px;border-radius:7px;}
  .btn-success{background:var(--success);color:#fff;}
  .btn-success:hover{filter:brightness(.94);}
  .btn-block{width:100%;justify-content:center;padding:11px;}

  /* ---------- SOLICITAÇÕES ---------- */
  .req-list{display:flex;flex-direction:column;gap:12px;}
  .req-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px 20px;cursor:pointer;transition:border-color .15s,box-shadow .15s;display:grid;grid-template-columns:1.5fr 1.6fr 1fr 0.9fr 0.8fr auto;gap:20px;align-items:center;}
  .req-card:hover{border-color:var(--accent);box-shadow:var(--shadow);}
  .req-field-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:600;margin-bottom:3px;}
  .req-client{font-weight:700;font-size:15px;}
  .req-sub{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}
  .tag-row{display:flex;flex-wrap:wrap;gap:6px;}
  .eq-tag{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;background:var(--accent-soft);color:var(--accent-ink);border-radius:6px;padding:3px 8px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;}
  .eq-tag.peca{background:var(--peca-soft);color:#4530a8;}
  .eq-tag.clickable{cursor:pointer;}
  .eq-tag.clickable:hover{outline:1.5px solid var(--accent);}
  .eflag{width:14px;height:14px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;line-height:1;color:#fff;}
  .eflag.ok{background:var(--success);}
  .eflag.no{background:var(--danger);}
  .eflag.na{background:#fff;color:var(--ink-soft);border:1.5px solid var(--line-strong);}
  .status-pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:5px 10px;border-radius:99px;white-space:nowrap;display:inline-block;}
  .status-Novo{background:var(--novo-soft);color:var(--novo);}
  .status-Disponivel{background:var(--success-soft);color:var(--success);}
  .status-NaoDisponivel{background:var(--danger-soft);color:var(--danger);}
  .empty-state{border:1.5px dashed var(--line-strong);border-radius:var(--radius-lg);padding:54px 20px;text-align:center;color:var(--ink-soft);}
  .empty-state h3{margin:0 0 6px;color:var(--ink);font-size:16px;}

  .pri-pill{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
  .pri-pill::before{content:"";width:7px;height:7px;border-radius:99px;background:currentColor;}
  .pri-Baixa{background:var(--pri-baixa-soft);color:var(--pri-baixa);}
  .pri-Media{background:var(--pri-media-soft);color:var(--pri-media);}
  .pri-Alta{background:var(--pri-alta-soft);color:var(--pri-alta);}
  .pri-Urgente{background:var(--pri-urgente-soft);color:var(--pri-urgente);}
  .pri-picker{display:flex;gap:8px;flex-wrap:wrap;}
  .pri-opt{flex:1;min-width:88px;border:1.5px solid var(--line-strong);border-radius:9px;padding:10px;text-align:center;cursor:pointer;font-weight:600;font-size:12.5px;transition:all .12s;background:#fff;color:var(--ink-soft);}
  .pri-opt.on.Baixa{border-color:var(--pri-baixa);background:var(--pri-baixa-soft);color:var(--pri-baixa);}
  .pri-opt.on.Media{border-color:var(--pri-media);background:var(--pri-media-soft);color:var(--pri-media);}
  .pri-opt.on.Alta{border-color:var(--pri-alta);background:var(--pri-alta-soft);color:var(--pri-alta);}
  .pri-opt.on.Urgente{border-color:var(--pri-urgente);background:var(--pri-urgente-soft);color:var(--pri-urgente);}

  /* ---------- MODAL ---------- */
  .overlay{position:fixed;inset:0;background:rgba(20,22,28,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px;backdrop-filter:blur(2px);}
  .modal{background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:640px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px -20px rgba(0,0,0,.35);}
  .modal-head{padding:22px 26px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;background:var(--surface);z-index:2;}
  .modal-head h2{margin:0;font-size:17px;font-weight:700;}
  .modal-close{background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;line-height:1;padding:4px;}
  .modal-body{padding:22px 26px 26px;}
  .modal-foot{padding:16px 26px 22px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface);flex-wrap:wrap;}

  /* Modal de nova/editar solicitação: mais largo e usando melhor a altura útil,
     especialmente em telas de notebook (baixas). Só afeta esta janela. */
  .modal-solic{max-width:760px;max-height:92vh;}
  .modal-solic .modal-body{padding:18px 26px 22px;}
  /* Telas de notebook (altura reduzida): aproveita quase toda a vertical, deixa o corpo
     rolar e compacta os espaçamentos internos para caber mais sem parecer apertado. */
  @media (min-width:761px) and (max-height:800px){
    .modal-solic{max-height:96vh;display:flex;flex-direction:column;}
    .modal-solic .modal-body{flex:1;overflow-y:auto;padding-top:14px;padding-bottom:16px;}
    .modal-solic .field{margin-bottom:12px;}
    .modal-solic .section-title{margin-top:14px;margin-bottom:8px;}
    .modal-solic textarea{min-height:60px;}
    .modal-solic .info-line{margin:8px 0;}
  }
  /* Notebooks largos: usa duas colunas de largura maior para reduzir a rolagem. */
  @media (min-width:1000px){
    .modal-solic{max-width:860px;}
  }
  .modal-foot .left{margin-right:auto;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{width:100%;border:1.5px solid var(--line-strong);border-radius:8px;padding:10px 12px;font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);background:#fff;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);}
  .field textarea{resize:vertical;min-height:70px;font-family:'Inter',sans-serif;}
  .field .hint{font-size:11px;color:var(--ink-soft);margin-top:5px;font-weight:400;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field-row-3{display:grid;grid-template-columns:2fr 1fr;gap:12px;}
  .eq-block{border:1.5px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;background:var(--paper);position:relative;}
  .eq-block .eq-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  .remove-x{background:none;border:none;color:var(--danger);cursor:pointer;font-size:12px;font-weight:600;}
  .add-eq-btn{width:100%;border:1.5px dashed var(--line-strong);background:none;border-radius:9px;padding:10px;color:var(--ink-soft);font-weight:600;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:18px;}
  .add-eq-btn:hover{border-color:var(--accent);color:var(--accent);}
  .info-line{font-size:12.5px;color:var(--ink-soft);background:var(--paper);border-radius:8px;padding:10px 12px;margin-bottom:16px;}
  .info-line.peca{background:var(--peca-soft);color:#4530a8;}
  .section-title{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin:18px 0 10px;}
  .status-radio-group{display:flex;gap:10px;flex-wrap:wrap;}
  .status-radio{flex:1;min-width:140px;border:1.5px solid var(--line-strong);border-radius:9px;padding:12px;text-align:center;cursor:pointer;font-weight:600;font-size:13px;transition:all .12s;background:#fff;}
  .status-radio.sel-disp{border-color:var(--success);background:var(--success-soft);color:var(--success);}
  .status-radio.sel-nao{border-color:var(--danger);background:var(--danger-soft);color:var(--danger);}
  .status-radio.disabled{opacity:.42;cursor:not-allowed;background:var(--paper);}
  .tech-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .tech-chip{border-radius:8px;padding:8px 6px;text-align:center;font-size:11.5px;font-weight:700;cursor:pointer;border:2px solid transparent;color:#fff;letter-spacing:.02em;}
  .tech-chip.selected{outline:3px solid var(--ink);outline-offset:1px;}
  .unit-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;}
  .unit-chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line-strong);border-radius:8px;padding:5px 9px;font-size:11.5px;font-weight:600;cursor:pointer;background:#fff;}
  .unit-chip .box{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--line-strong);display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;line-height:1;}
  .unit-chip.done{border-color:var(--success);background:var(--success-soft);color:var(--success);}
  .unit-chip.done .box{background:var(--success);border-color:var(--success);}
  .item-head{font-size:12px;font-weight:800;color:#fff;border-radius:7px;padding:6px 10px;display:inline-flex;align-items:center;gap:8px;}

  /* ---------- KANBAN ---------- */
  .kanban-scroll-top{overflow-x:auto;overflow-y:hidden;height:10px;margin-bottom:4px;flex-shrink:0;}
  .kanban-scroll-top>div{height:1px;}
  .kanban-scroll-top::-webkit-scrollbar{height:7px;}
  .kanban-scroll-top::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;}
  .kanban-wrap{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;}
  .kanban-wrap::-webkit-scrollbar{height:7px;}
  .kanban-wrap::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;}
  .kanban-col{background:#EFEDE7;border-radius:var(--radius-lg);min-width:240px;flex:1;display:flex;flex-direction:column;}
  .kanban-col-head{padding:9px 12px 7px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--ink);flex-shrink:0;}
  .kanban-col-head h3{margin:0;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .kanban-col-head .count{font-family:'JetBrains Mono',monospace;background:var(--ink);color:#fff;border-radius:99px;font-size:10px;padding:2px 7px;}
  .head-counts{display:inline-flex;align-items:center;gap:3px;}
  .pchip{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:800;color:#fff;border-radius:99px;padding:1px 5px;line-height:1.5;}
  .pchip.u{background:var(--pri-urgente);}
  .pchip.a{background:var(--pri-alta);}
  .pchip.m{background:var(--pri-media);}
  .pchip.b{background:var(--pri-baixa);}
  .kanban-col-body{padding:7px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex:1;min-height:50px;}

  /* main-kanban: faz a coluna do kanban ocupar o espaço vertical disponível na tela
     (celular/pc pequeno ou monitor grande/TV) sem precisar rolar a página inteira —
     só a lista de cards dentro de cada coluna rola. */
  .main-kanban{display:flex;flex-direction:column;height:calc(100dvh - 78px);padding-bottom:10px!important;}
  .main-kanban .controls{flex-shrink:0;}
  .main-kanban .kanban-scroll-top{flex-shrink:0;}
  .main-kanban .kanban-wrap{flex:1;min-height:0;}
  .main-kanban .kanban-col{max-height:100%;}

  .kcard{background:var(--surface);border-radius:8px;padding:7px 8px;cursor:grab;border:1px solid var(--line);border-left:4px solid var(--line-strong);box-shadow:0 1px 2px rgba(0,0,0,.04);position:relative;}
  .kcard:active{cursor:grabbing;}
  .kcard.dragging{opacity:.4;}
  .kcard.p-Baixa{border-left-color:var(--pri-baixa);}
  .kcard.p-Media{border:1.5px solid var(--pri-media);border-left:5px solid var(--pri-media);background:linear-gradient(0deg,var(--pri-media-soft),#fff 58%);}
  .kcard.p-Alta{border:1.5px solid var(--pri-alta);border-left:5px solid var(--pri-alta);background:linear-gradient(0deg,var(--pri-alta-soft),#fff 58%);}
  .kcard.p-Urgente{border:1.5px solid var(--pri-urgente);border-left:5px solid var(--pri-urgente);background:linear-gradient(0deg,var(--pri-urgente-soft),#fff 58%);box-shadow:0 0 0 1px rgba(192,57,43,.30),0 6px 16px -8px rgba(192,57,43,.4);animation:urgPulse 1.9s ease-in-out infinite;}
  @keyframes urgPulse{0%,100%{box-shadow:0 0 0 1px rgba(192,57,43,.30),0 6px 16px -8px rgba(192,57,43,.4);}50%{box-shadow:0 0 0 4px rgba(192,57,43,.16),0 6px 16px -8px rgba(192,57,43,.5);}}
  @media (prefers-reduced-motion:reduce){.kcard.p-Urgente{animation:none;}}
  .kcard.atrasado{border:1.5px solid var(--danger)!important;border-left:5px solid var(--danger)!important;}
  /* linha 1: metadados compactos (prioridade à esquerda, tipo/dias/excluir à direita) */
  .kc-head{display:flex;align-items:center;gap:6px;}
  .kc-pos{flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:var(--ink-soft);opacity:.6;min-width:14px;}
  .kc-flag{flex-shrink:0;color:#fff;font-size:9px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:2px 6px;border-radius:4px;line-height:1.4;}
  .kc-flag.f-Baixa{background:var(--pri-baixa);}
  .kc-flag.f-Media{background:var(--pri-media);}
  .kc-flag.f-Alta{background:var(--pri-alta);}
  .kc-flag.f-Urgente{background:var(--pri-urgente);}
  .kc-tipo{flex-shrink:0;margin-left:auto;font-size:9.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.02em;}
  .kc-dias{flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:var(--ink-soft);background:var(--paper);padding:1px 6px;border-radius:99px;}
  .kc-dias.ok{color:var(--success);background:var(--success-soft);}
  .kc-dias.late{color:var(--danger);background:var(--danger-soft);}
  .kc-del{flex-shrink:0;background:none;border:none;cursor:pointer;color:var(--ink-soft);padding:1px;border-radius:5px;line-height:1;display:flex;opacity:.55;}
  .kc-del:hover{background:var(--danger-soft);color:var(--danger);opacity:1;}
  .kc-del svg{width:12px;height:12px;}
  /* linha 2: cliente sozinho, largura total, sem corte (quebra se preciso) */
  .kc-client{font-weight:800;font-size:14px;line-height:1.2;text-transform:uppercase;letter-spacing:.01em;margin-top:3px;overflow-wrap:anywhere;}
  /* linha NF + itens coloridos, tudo junto */
  .kc-line{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:5px;}
  .kc-nf{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-soft);background:var(--paper);padding:1px 6px;border-radius:4px;}
  .kc-sum{display:inline-flex;align-items:center;gap:4px;border-radius:5px;padding:2px 7px;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;}
  .kc-sum b{font-weight:800;}
  .btn-marcar-todos{font-size:10px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border:none;border-radius:6px;padding:4px 9px;cursor:pointer;white-space:nowrap;}
  .btn-marcar-todos.on{color:var(--success);background:var(--success-soft);}
  /* linha de metadados (solicitante · local · previsão) */
  .kc-line-meta{gap:2px 10px;margin-top:5px;font-size:10.5px;color:var(--ink-soft);font-weight:600;}
  .kc-line-meta span{display:inline-flex;align-items:center;gap:3px;}
  /* indicador visual de que a data é uma PREVISÃO (estimativa), não um compromisso fixo:
     sublinhado tracejado = calculada automaticamente pela fila; sublinhado sólido azul =
     ajustada manualmente pelo técnico. */
  .previsao-val{border-bottom:1.5px dashed var(--line-strong);padding-bottom:1px;}
  .previsao-val.manual{border-bottom-style:solid;border-bottom-color:var(--accent);color:var(--accent-ink);}
  .prazo-tarja{font-size:10px;font-weight:700;border-radius:5px;padding:3px 7px;margin-top:5px;display:flex;align-items:center;gap:5px;}
  .prazo-tarja::before{content:"";width:5px;height:5px;border-radius:99px;background:currentColor;}
  .prazo-warn{background:var(--warn-soft);color:var(--warn);}
  .prazo-late{background:var(--danger-soft);color:var(--danger);}
  /* rodapé: barra de progresso + % + técnico + arquivar, tudo em uma linha */
  .kc-foot{display:flex;align-items:center;gap:6px;margin-top:6px;}
  .kc-progress-track{height:5px;border-radius:99px;background:var(--line);overflow:hidden;flex:1;min-width:40px;}
  .kc-progress-fill{height:100%;border-radius:99px;background:var(--accent);transition:width .25s ease;}
  .kc-progress-fill.full{background:var(--success);}
  .kc-progress-pct{flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-soft);font-weight:700;}
  .kc-tecnico{flex-shrink:0;font-size:10px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:2px 7px;border-radius:5px;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kc-archive-btn{flex-shrink:0;font-size:11px;font-weight:800;color:var(--success);background:var(--success-soft);border:none;border-radius:5px;padding:2px 8px;cursor:pointer;}
  .col-drop-zone{min-height:36px;border-radius:8px;}
  .col-drop-zone.drag-over{background:rgba(36,84,255,.08);outline:2px dashed var(--accent);}
  .badge-tipo{font-size:11px;font-weight:700;background:#EDEBFB;color:#5B3FD1;padding:2px 7px;border-radius:5px;display:inline-block;}
  /* classes usadas em modais (não no card do quadro) */
  .kc-sums{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
  .kc-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .card-flag{display:inline-flex;align-items:center;gap:4px;color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:5px;}
  .card-flag.f-Baixa{background:var(--pri-baixa);}
  .card-flag.f-Media{background:var(--pri-media);}
  .card-flag.f-Alta{background:var(--pri-alta);}
  .card-flag.f-Urgente{background:var(--pri-urgente);}

  /* ---------- MINI-DASHBOARD DO KANBAN (linha dos filtros) ---------- */
  .ctrl-sm{padding:6px 8px;font-size:11.5px;}
  .kstat-a{font-size:11px;color:var(--ink-soft);}
  .kstat-modo{min-width:118px;}
  .kpi-dash{display:flex;align-items:center;gap:14px;padding:2px 4px;}
  .kpi-dash-grp{display:flex;align-items:center;gap:12px;}
  .kpi-dash-ico{font-size:15px;line-height:1;}
  .kpi-dash-div{width:1px;align-self:stretch;background:var(--line-strong);margin:2px 0;}
  .kpi-num{display:flex;flex-direction:column;align-items:center;line-height:1;min-width:34px;}
  .kpi-num b{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--ink);}
  .kpi-num small{font-size:9.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}
  .kpi-num.done b{color:var(--success);}
  .kpi-num.pend b{color:var(--warn);}

  /* telas grandes / TV: aproveita a altura extra pra mostrar mais cards */
  @media (min-width:1400px){
    .main-kanban{height:calc(100dvh - 74px);}
    .kanban-col{min-width:250px;}
    .kanban-col-head h3{font-size:13px;}
    .kc-client{font-size:15.5px;}
    .kc-sum{font-size:12px;}
    .kc-line-meta{font-size:11.5px;}
    .kc-nf,.kc-dias,.kc-tecnico,.prazo-tarja,.kc-tipo{font-size:11px;}
    .kc-flag{font-size:10px;}
  }
  /* TV / telão: fontes bem maiores para leitura à distância */
  @media (min-width:1920px){
    .main-kanban{height:calc(100dvh - 68px);}
    .kanban-wrap{gap:12px;}
    .kanban-col{min-width:290px;}
    .kanban-col-head h3{font-size:15px;}
    .kanban-col-head .count{font-size:12px;}
    .kcard{padding:9px 11px;}
    .kc-client{font-size:18px;}
    .kc-sum{font-size:13.5px;padding:3px 9px;}
    .kc-line-meta{font-size:13px;}
    .kc-nf,.kc-dias,.kc-tecnico,.kc-tipo{font-size:12.5px;}
    .prazo-tarja{font-size:12.5px;}
    .kc-flag{font-size:11.5px;padding:2px 8px;}
    .kc-progress-pct{font-size:11.5px;}
    .kc-progress-track{height:6px;}
  }

  /* ---------- ARQUIVO ---------- */
  .mes-group{margin-bottom:22px;}
  .mes-head{display:flex;align-items:center;gap:10px;margin:0 0 12px;}
  .mes-head h3{margin:0;font-size:14px;font-weight:700;}
  .mes-head .mes-count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);background:var(--novo-soft);padding:2px 8px;border-radius:99px;}
  .mes-head .rule{flex:1;height:1px;background:var(--line);}
  .arch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;}
  .arch-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;}
  .arch-card .ac-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;}
  .arch-card .ac-client{font-weight:700;font-size:13.5px;}
  .arch-card .ac-meta{font-size:11px;color:var(--ink-soft);margin-top:2px;line-height:1.5;}
  .arch-card .ac-tags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0;}

  /* ---------- HISTÓRICO / NOTIFICAÇÕES ---------- */
  .hist-day{margin-bottom:18px;}
  .hist-day h4{margin:0 0 8px;font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;}
  .hist-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .hist-item:last-child{border-bottom:none;}
  .hist-time{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);flex-shrink:0;width:42px;}
  .hist-txt{flex:1;}
  .hist-user{color:var(--ink-soft);font-size:11px;font-weight:600;white-space:nowrap;}
  .hist-dot{width:7px;height:7px;border-radius:99px;background:var(--accent);margin-top:5px;flex-shrink:0;}
  .noti-item{display:flex;gap:10px;padding:11px 12px;border-radius:10px;font-size:13px;margin-bottom:8px;background:var(--paper);}
  .noti-item.unread{background:var(--accent-soft);}
  .noti-item.noti-pessoal{border-left:3px solid var(--accent);}
  .noti-tag-you{display:inline-block;background:var(--accent);color:#fff;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:99px;vertical-align:middle;}
  .noti-item .nd{width:8px;height:8px;border-radius:99px;margin-top:5px;flex-shrink:0;}
  .nd.nova{background:var(--accent);}.nd.status{background:var(--warn);}.nd.venc{background:var(--danger);}.nd.info{background:var(--ink-soft);}
  .noti-item .nt{flex:1;}
  .noti-item time{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-soft);}

  /* ---------- DASHBOARD ---------- */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px;}
  /* linha única de grupos de KPIs compactos */
  .dash-top{display:grid;grid-template-columns:1fr 1fr 1fr 1.35fr;gap:10px;margin-bottom:12px;}
  .kpi-group{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
  .kpi-group-title{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:8px;}
  .kpi-group-title small{text-transform:none;letter-spacing:0;font-weight:500;}
  .kpi-group-nums{display:flex;gap:14px;}
  .kpi-mini{display:flex;flex-direction:column;line-height:1;min-width:0;}
  .kpi-mini b{font-family:'Space Grotesk',sans-serif;font-size:23px;font-weight:700;color:var(--ink);}
  .kpi-mini small{font-size:9.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-top:3px;white-space:nowrap;}
  .kpi-mini.done b{color:var(--success);}
  .kpi-mini.pend b{color:var(--warn);}
  .kpi-mini.sobre-ok b{color:var(--success);}
  .kpi-mini.sobre-meio b{color:var(--warn);}
  .kpi-mini.sobre-alto b{color:var(--danger);}
  .sobre-table{width:100%;border-collapse:collapse;font-size:12px;}
  .sobre-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;padding:6px 8px;border-bottom:1.5px solid var(--line-strong);}
  .sobre-table td{padding:7px 8px;border-bottom:1px solid var(--line);}
  .sobre-table td.mono{font-family:'JetBrains Mono',monospace;text-align:right;}
  .sobre-table .tech-dot{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:7px;}
  .sobre-cell-ok{color:var(--success);font-weight:700;}
  .sobre-cell-meio{color:var(--warn);font-weight:700;}
  .sobre-cell-alto{color:var(--danger);font-weight:700;}
  .kpi-group.taxas .kpi-group-nums{gap:12px;justify-content:space-between;}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;}
  .kpi .kpi-val{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;line-height:1;}
  .kpi .kpi-lbl{font-size:11.5px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:6px;}
  .kpi.k-done .kpi-val{color:var(--success);}
  .kpi.k-pend .kpi-val{color:var(--warn);}
  .kpi.k-run .kpi-val{color:var(--accent);}
  .bar-row-tipo{grid-template-columns:150px 1fr 110px;}
  .bar-row-tipo .bv{font-size:10px;}
  /* painéis mais densos para caber sem rolagem */
  .dash-grid-compact{gap:10px;}
  .panel-c{padding:12px 14px;}
  .panel-c h3{margin:0 0 9px;font-size:12.5px;}
  .panel-c .bar-row{margin-bottom:4px;font-size:11px;grid-template-columns:92px 1fr 42px;gap:8px;}
  .panel-c .bar-row-tipo{grid-template-columns:130px 1fr 100px;}
  .panel-c .bar-track,.panel-c .stack{height:12px;}
  .panel-c .legend{margin-top:5px;font-size:10px;gap:10px;}
  .panel-c .req-sub{margin:2px 0;font-size:11.5px;}
  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;}
  .panel h3{margin:0 0 14px;font-size:14px;font-weight:700;}
  .bar-row{display:grid;grid-template-columns:110px 1fr 46px;align-items:center;gap:10px;margin-bottom:9px;font-size:12px;}
  .bar-row .bl{color:var(--ink-soft);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{background:var(--paper);border-radius:99px;height:16px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:99px;background:var(--accent);min-width:2px;}
  .bar-fill.g{background:var(--success);}
  .bar-fill.o{background:var(--pri-alta);}
  .bar-fill.v{background:var(--peca);}
  .bar-row .bv{text-align:right;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11.5px;}
  .stack{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--paper);}
  .stack .s-done{background:var(--success);}.stack .s-run{background:var(--accent);}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--ink-soft);margin-top:6px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(18px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 8px 24px -8px rgba(0,0,0,.45);display:inline-flex;align-items:center;gap:8px;max-width:90vw;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- CADASTRO DE USUÁRIOS ---------- */
  .user-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
  .user-card.inactive{opacity:.5;}
  .user-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .user-name{font-weight:700;font-size:14px;}
  .user-login{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--ink-soft);}
  .user-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .perm-table{width:100%;border-collapse:collapse;font-size:12px;}
  .perm-table th{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);text-align:center;padding:4px 6px;font-weight:700;}
  .perm-table th:first-child,.perm-table td:first-child{text-align:left;}
  .perm-table td{padding:6px;text-align:center;border-top:1px solid var(--line);}
  .perm-chk{width:16px;height:16px;cursor:pointer;accent-color:var(--accent);}
  .ativo-pill{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;text-transform:uppercase;}
  .ativo-pill.on{background:var(--success-soft);color:var(--success);}
  .ativo-pill.off{background:var(--danger-soft);color:var(--danger);}

  @media (max-width:760px){
    .topbar{gap:10px;padding:10px 14px;}
    .topbar .brand-h{font-size:15px;} .topbar .divider{display:none;}
    .nav-btn .count{display:none;} .top-user{display:none;}
    .main{padding:14px;}
    .req-card{grid-template-columns:1fr 1fr;gap:14px 16px;}
    .req-card>div:last-child{grid-column:1 / -1;text-align:left;}
    .req-card>div:last-child .btn{width:100%;justify-content:center;}
    .field-row,.field-row-3{grid-template-columns:1fr;}
    .tech-grid{grid-template-columns:repeat(3,1fr);}
    .overlay{padding:0;align-items:flex-end;}
    .modal{max-width:100%;max-height:94vh;border-radius:18px 18px 0 0;}
    /* no celular a coluna volta a rolar junto com a página (mais natural ao toque)
       em vez de ficar presa numa altura fixa como no desktop/TV */
    .main-kanban{height:auto;display:block;}
    .kanban-col{min-width:85vw;max-height:none;}
    .kc-client{font-size:16px;}
    .kc-sum{font-size:12.5px;padding:3px 8px;}
    .kc-line-meta{font-size:12.5px;}
    .kc-nf,.kc-dias,.kc-tecnico,.prazo-tarja,.kc-tipo{font-size:12px;}
    .kc-flag{font-size:11px;}
    .kpi-dash{width:100%;justify-content:space-between;padding:8px 2px 2px;order:10;}
    .kpi-num b{font-size:19px;}
    .dash-grid{grid-template-columns:1fr;}
    .dash-top{grid-template-columns:1fr 1fr;}
    .kpi-group.taxas{grid-column:1 / -1;}
    .kpi-mini b{font-size:19px;}
    .bar-row{grid-template-columns:88px 1fr 40px;}
    .bar-row-tipo{grid-template-columns:96px 1fr 84px;}
  }
  @media (max-width:520px){
    .req-card{grid-template-columns:1fr;}
    .tech-grid{grid-template-columns:repeat(2,1fr);}
    .arch-grid{grid-template-columns:1fr;}
    input.ctrl-search{flex:1 1 100%;}
    .kanban-col{min-width:88vw;}
    .kpi-dash{gap:8px;}
    .kpi-dash-grp{gap:8px;}
    .kpi-num{min-width:28px;}
    .kpi-num b{font-size:17px;}
    .kpi-num small{display:none;}
    .dash-top{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

// ---------------- TECNOLOGIA AUTOMÁTICA POR MODELO ----------------
// Deduz a tecnologia do equipamento a partir do prefixo do modelo, para pré-preencher a
// confirmação do técnico ao enviar o equipamento para o Kanban (ele pode ajustar se
// necessário — isso só sugere, não trava a escolha).
// Regras (nessa ordem, a primeira que bater vence):
//   210, P34, Ketan, ou começa com "9"  → LPA
//   começa com "1"                      → CIJ
//   começa com "2" (exceto 210, acima)  → LCM
//   começa com "6" ou "D"               → TTO
//   começa com "8" ou "W"               → TIJ
//   começa com "3" ou "7"               → LASER
function tecnologiaAutoDoModelo(modelo){
  const m=(modelo||'').trim().toUpperCase();
  if(!m) return '';
  if(m==='210'||m==='P34'||m==='KETAN'||m.startsWith('9')) return 'LPA';
  if(m.startsWith('1')) return 'CIJ';
  if(m.startsWith('2')) return 'LCM';
  if(m.startsWith('6')||m.startsWith('D')) return 'TTO';
  if(m.startsWith('8')||m.startsWith('W')) return 'TIJ';
  if(m.startsWith('3')||m.startsWith('7')) return 'LASER';
  return '';
}
// ---------------- SLA POR TECNOLOGIA (dias médios em Serviço) ----------------
// Usado para calcular automaticamente a "Previsão de conclusão" dos cards do Kanban,
// com base na posição de cada card na fila de Recebimento (ordenada por prioridade).
const SLA_TECNOLOGIA = {
  CIJ:4.53028065, EXTRATOR:3.295081967, LASER:2.418367347, LCM:3.852459016,
  LPA:2.816326531, TIJ:1.925, TTO:2.578512397,
};
// Cards de PEÇAS não têm "tecnologia" associada, então não há SLA específico informado
// para eles. Até que um valor próprio seja definido, usamos a média dos SLAs acima como
// estimativa — ajuste SLA_PECAS_PADRAO livremente se quiser um número diferente.
const SLA_PECAS_PADRAO = Object.values(SLA_TECNOLOGIA).reduce((a,b)=>a+b,0)/Object.keys(SLA_TECNOLOGIA).length;
// Capacidade observada de peças: 3,3 peças concluídas por dia (informado pela operação).
// É uma taxa de vazão (throughput), diferente do SLA_PECAS_PADRAO acima (que é "dias médios
// por card", usado só para estimar a previsão de conclusão de um card específico). Usamos
// esta constante exclusivamente no cálculo de sobrecarga do dashboard.
const CAPACIDADE_PECAS_DIA = 3.3;
// SLA "efetivo" de um card: quando ele tem mais de um item/tecnologia, usamos o maior
// SLA entre eles (o card só termina quando o item mais demorado também terminar).
function slaDoCard(card){
  const slas=(card.itens||[]).map(it=> it.kind==='peca' ? SLA_PECAS_PADRAO : (SLA_TECNOLOGIA[it.tecnologia] ?? SLA_PECAS_PADRAO));
  return slas.length?Math.max(...slas):SLA_PECAS_PADRAO;
}
// Soma dias corridos (arredondado) a uma data 'yyyy-mm-dd', devolvendo outra 'yyyy-mm-dd'.
function addDiasData(baseStr,dias){
  const [y,m,d]=baseStr.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  dt.setDate(dt.getDate()+Math.round(dias));
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}

// Municípios do Brasil (IBGE). Carregados sob demanda da API oficial e mantidos em
// cache na memória. Enquanto não carregam, o campo cidade segue como texto livre.
let MUNICIPIOS_BR=null;          // lista completa [{nome,uf}] após carregar
let municipiosCarregando=false;
function municipiosParaUF(uf){
  if(!MUNICIPIOS_BR) return [];
  const l = uf ? MUNICIPIOS_BR.filter(m=>m.uf===uf) : MUNICIPIOS_BR;
  return l.map(m=>m.nome);
}
async function carregarMunicipios(){
  if(MUNICIPIOS_BR||municipiosCarregando) return;
  municipiosCarregando=true;
  try{
    const res=await fetch('https://servicodados.ibge.gov.br/api/v1/localidades/municipios?orderBy=nome');
    const data=await res.json();
    MUNICIPIOS_BR=data.map(m=>({ nome:m.nome, uf:(m.microrregiao&&m.microrregiao.mesorregiao&&m.microrregiao.mesorregiao.UF&&m.microrregiao.mesorregiao.UF.sigla)||'' }));
    // se o modal de nova solicitação estiver aberto, re-renderiza para preencher o datalist
    if(state.modal&&state.modal.type==='nova') render();
  }catch(err){
    console.warn('Não foi possível carregar a lista de municípios do IBGE (o campo cidade segue como texto livre):',err);
  }finally{
    municipiosCarregando=false;
  }
}

// ---------------- AJUSTE AUTOMÁTICO DE CAPITALIZAÇÃO ----------------
// Se o texto digitado estiver TODO em minúsculas ou TODO em maiúsculas, corrige para
// o formato de título ("teste" → "Teste", "INDÚSTRIA ALFA LTDA" → "Indústria Alfa Ltda"),
// mantendo conectivos em minúsculo. Textos com maiúsculas/minúsculas misturadas são
// respeitados como o usuário digitou (ex.: siglas no meio de um nome).
const CONECTIVOS_PT=new Set(['de','da','do','das','dos','e','em','a','o','as','os','para','com','sem','no','na','nos','nas','ao','aos','à','às','por','sob','sobre']);
function ajustarCapitalizacao(v){
  const letras=(v||'').replace(/[^A-Za-zÀ-ÖØ-öø-ÿ]/g,'');
  if(!letras) return v;
  const soMinusculas=letras===letras.toLowerCase();
  const soMaiusculas=letras===letras.toUpperCase();
  if(!soMinusculas&&!soMaiusculas) return v; // caixa mista: usuário formatou de propósito
  return v.toLowerCase().replace(/[A-Za-zÀ-ÖØ-öø-ÿ]+/g,(palavra,pos)=>{
    if(pos>0&&CONECTIVOS_PT.has(palavra)) return palavra;
    return palavra.charAt(0).toUpperCase()+palavra.slice(1);
  });
}
// Aplica ao sair de qualquer campo de texto/textarea editável, exceto os marcados com
// data-nocase (login, senha, busca, tipo de atendimento, código, modelo, NF), onde a
// caixa das letras tem significado técnico e não pode ser alterada.
document.addEventListener('focusout',e=>{
  const el=e.target;
  if(!el) return;
  const ehTexto=(el.tagName==='INPUT'&&el.type==='text')||el.tagName==='TEXTAREA';
  if(!ehTexto||el.disabled||el.readOnly) return;
  if(el.hasAttribute('data-nocase')) return;
  const v=el.value; if(!v||!v.trim()) return;
  const novo=ajustarCapitalizacao(v);
  if(novo!==v){
    el.value=novo;
    // repassa o valor corrigido para os handlers inline existentes (oninput/onchange),
    // garantindo que o estado interno receba o texto já formatado
    el.dispatchEvent(new Event('input',{bubbles:true}));
    el.dispatchEvent(new Event('change',{bubbles:true}));
  }
},true);

// Dias corridos desde a abertura do card. Enquanto não concluído, conta até hoje (ao vivo);
// assim que chega em "Concluído" o contador é congelado na data em que isso aconteceu.
function diasKanban(card){
  const ini=card.data instanceof Date?card.data:new Date(card.data);
  const fim=(card.col==='Concluído'&&card.dataConclusao)?(card.dataConclusao instanceof Date?card.dataConclusao:new Date(card.dataConclusao)):new Date();
  return Math.max(0,Math.floor((fim-ini)/86400000));
}
// Move um card para outra coluna. Ao chegar em "Concluído", marca automaticamente todas
// as unidades de equipamentos/peças como concluídas e congela a contagem de dias.
function aplicarMudancaColuna(card,novaCol){
  const de=card.col;
  if(de===novaCol) return;
  card.col=novaCol;
  if(novaCol==='Recebimento') posicionarNoFimDaPrioridade(card); else card.km=null; // nova coluna: fila (se Recebimento) ou ordenação automática por prioridade
  if(novaCol==='Concluído'){
    card.itens.forEach(it=>{ if(it.doneUnits) it.doneUnits=it.doneUnits.map(()=>true); });
    if(!card.dataConclusao) card.dataConclusao=new Date();
    if(card.solicitanteUser&&!card.avisadoConclusao){
      card.avisadoConclusao=true;
      const cod=card.codigoSolic?` ${card.codigoSolic}`:'';
      notificar(`🎉 Sua solicitação${cod} (${escapeHtml(card.cliente)}) foi CONCLUÍDA com sucesso! Todos os itens (${descricaoItensKanban(card)}) estão prontos e seguindo com os trâmites de envio.`,'status',card.solicitanteUser,{cliente:card.cliente,cidade:card.cidade});
    }
  } else if(de==='Concluído'){
    card.dataConclusao=null; // saiu de Concluído — volta a contar os dias normalmente
    card.avisadoConclusao=false; // se reabriu, permite avisar de novo numa próxima conclusão
  }
  logAtv(`Card de "${card.cliente}" movido de ${de} para ${novaCol}.`);
  notificar(`${card.cliente}: ${de} → ${novaCol}.`,'status');
}

// Envia a notificação também por e-mail, via Google Apps Script (MailApp).
// Só age para notificações direcionadas a um usuário que tenha e-mail cadastrado.
// Falhas de envio não interrompem o app — a notificação no sino continua valendo.
// Deriva um rótulo curto de status a partir do texto da notificação, para o assunto do e-mail.
function statusParaAssunto(texto){
  const t=(texto||'').toLowerCase();
  if(t.includes('recebemos sua solicitação')) return 'Recebido';
  if(t.includes('foi concluída')||t.includes('foi concluida')) return 'Concluído';
  if(t.includes('não temos o material')||t.includes('nao temos o material')) return 'Não Disponível';
  if(t.includes('disponibilidade parcial')) return 'Disponível Parcial';
  if(t.includes('temos o material disponível')||t.includes('temos o material disponivel')) return 'Disponível';
  if(t.includes('foi arquivada')) return 'Arquivado';
  if(t.includes('foi atualizada com o novo material')||t.includes('reenviada para verificação')) return 'Reenviado';
  return '';
}
function enviarEmailNotificacao(usuarioLogin,texto,tipo,meta){
  try{
    const u=state.usuarios.find(x=>x.usuario===usuarioLogin);
    if(!u||!u.email||!u.email.trim()) return;
    // Extrai o código da solicitação (ex: SOL-2026-0028) do texto da notificação, se houver.
    const mCod=(texto||'').match(/SOL-\d{4}-\d+/i);
    const numero=mCod?mCod[0]:'';
    const status=statusParaAssunto(texto);
    const cliente=(meta&&meta.cliente)?meta.cliente:'';
    const cidade=(meta&&meta.cidade)?meta.cidade:'';
    const partes=['Atualização', cliente, cidade, numero, status, 'Lab. Extrema'].filter(Boolean);
    const assunto=partes.join(' - ');
    fetch(SHEETS_URL,{ method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({ acao:'enviarEmail', para:u.email.trim(), nome:u.nome||'', assunto, mensagem:texto }) })
      .catch(err=>console.warn('Falha ao solicitar envio de e-mail (a notificação no sistema foi mantida):',err));
  }catch(e){ console.warn('Erro ao preparar e-mail de notificação:',e); }
}

const SESSAO_KEY='ce_sessao_usuario';
function salvarSessao(usuario){ try{ localStorage.setItem(SESSAO_KEY,usuario); }catch(e){} }
function limparSessao(){ try{ localStorage.removeItem(SESSAO_KEY); }catch(e){} }
function restaurarSessao(){
  try{
    const usuario=localStorage.getItem(SESSAO_KEY);
    if(!usuario) return;
    const u=state.usuarios.find(x=>x.usuario===usuario&&x.ativo!==false);
    if(u){ state.currentUser=u; if(!temPermissao(state.page,'ver')) state.page=primeiraAbaPermitida()||'solicitacoes'; }
    else limparSessao();
  }catch(e){}
}
function voltarLogin(){ state.loginMode='entrar'; state.loginErr=''; render(); }
function fazerLogin(){
  const u=(document.getElementById('login-user')||{}).value||'';
  const p=(document.getElementById('login-pass')||{}).value||'';
  const found=state.usuarios.find(x=>x.usuario===u.trim().toLowerCase()&&x.senha===p&&x.ativo!==false);
  if(found){ state.currentUser=found; state.loginErr=""; salvarSessao(found.usuario); if(!temPermissao(state.page,'ver')) state.page=primeiraAbaPermitida()||'solicitacoes'; logAtv(`${found.nome} entrou no sistema.`); render(); }
  else { state.loginErr="Usuário ou senha inválidos, ou usuário inativo."; render(); const pw=document.getElementById('login-pass'); if(pw) pw.focus(); }
}
function trocarSenhaLogin(){
  const u=(document.getElementById('tp-user')||{}).value||'';
  const atual=(document.getElementById('tp-atual')||{}).value||'';
  const nova=(document.getElementById('tp-nova')||{}).value||'';
  const conf=(document.getElementById('tp-conf')||{}).value||'';
  if(nova!==conf){ state.loginMsg='As senhas novas não coincidem.'; render(); return; }
  const r=trocarSenha(u,atual,nova);
  if(!r.ok){ state.loginMsg=r.msg; render(); return; }
  state.loginMode='entrar'; state.loginErr='Senha alterada com sucesso. Faça login com a nova senha.'; state.loginMsg=''; render();
}
function trocarSenha(usuarioLogin,senhaAtual,novaSenha){
  const u=state.usuarios.find(x=>x.usuario===(usuarioLogin||'').trim().toLowerCase());
  if(!u) return {ok:false,msg:'Usuário não encontrado.'};
  if(u.senha!==senhaAtual) return {ok:false,msg:'Senha atual incorreta.'};
  if(!novaSenha||novaSenha.length<4) return {ok:false,msg:'A nova senha precisa ter ao menos 4 caracteres.'};
  u.senha=novaSenha;
  logAtv(`${u.nome} alterou a própria senha.`);
  return {ok:true};
}
function abrirTrocarSenhaInterna(){ state.modal={type:'trocarSenhaInterna'}; render(); }
function logout(){ pedirConfirmacao('Sair','Deseja encerrar a sessão?',()=>{ logAtv(`${state.currentUser.nome} saiu.`); state.currentUser=null; state.modal=null; limparSessao(); render(); },'Sair'); }

  if(f.busca&&f.busca.trim()){ const q=f.busca.trim().toLowerCase(); list=list.filter(r=>r.cliente.toLowerCase().includes(q)||(r.codigo||'').toLowerCase().includes(q)||itensDaSolic(r).some(e=>(e.modelo||e.codigo||'').toLowerCase().includes(q))); }
  const mesesOpts=Array.from(new Set(solicAtivas().map(r=>ymDeData(r.data)))).sort().reverse();
  return `
    <div class="controls">
      <span class="page-label">Solicitações</span>
      ${segSolic()}

        <option value="Não Disponível" ${f.status==='Não Disponível'?'selected':''}>Não Disponível</option>
      </select>
      <select class="ctrl" onchange="setFiltro('mes',this.value)"><option value="">Mês</option>${mesesOpts.map(ym=>`<option value="${ym}" ${f.mes===ym?'selected':''}>${mesLabel(ym)}</option>`).join('')}</select>
      ${(f.status||f.mes||f.busca)?`<button class="filter-clear" onclick="limparFiltros()">Limpar</button>`:''}

      ${temPermissao('solicitacoes','editar')?`<button class="btn btn-primary btn-sm" onclick="openNovaSolicitacao()">+ Nova solicitação</button>`:''}
    </div>
    <div class="req-list">${list.length===0?`<div class="empty-state"><h3>Nenhuma solicitação ativa</h3><p>Clique em "Nova solicitação" para registrar um pedido.</p></div>`:list.map(renderReqCard).join('')}</div>`;

function segSolic(){ return `<div class="seg"><button class="${state.solView==='ativos'?'on':''}" onclick="setSolView('ativos')">Ativos</button><button class="${state.solView==='arquivo'?'on':''}" onclick="setSolView('arquivo')">Arquivados <span class="mono">${solicArquivadas().length}</span></button></div>`; }
function renderSolicArquivo(){
  const fa=state.filtroArq;
  let arq=solicArquivadas().slice();
  if(fa.ano) arq=arq.filter(r=>(r.mesArquivo||ymDeData(r.data)).startsWith(fa.ano));
  if(fa.ano&&fa.mes) arq=arq.filter(r=>(r.mesArquivo||ymDeData(r.data))===fa.ano+'-'+fa.mes);
  if(fa.busca&&fa.busca.trim()){ const q=fa.busca.trim().toLowerCase(); arq=arq.filter(r=>r.cliente.toLowerCase().includes(q)||(r.codigo||'').toLowerCase().includes(q)); }
  if(arq.length===0) return `<div class="empty-state"><h3>Nada encontrado</h3><p>${(fa.ano||fa.busca)?'Nenhuma solicitação arquivada corresponde ao filtro.':'Solicitações enviadas ao Kanban aparecem aqui, por mês.'}</p></div>`;
  return groupByMes(arq,r=>r.mesArquivo||ymDeData(r.data)).map(g=>`

function getFilteredKanban(){
  let l=kanbanAtivos(); const f=state.kanFilters;
  if(f.prioridade) l=l.filter(c=>(c.prioridade||'Média')===f.prioridade);
  if(f.tipo) l=l.filter(c=>c.tipo===f.tipo);
  if(f.tecnico) l=l.filter(c=>(c.tecnico||'')===f.tecnico);
  if(f.busca&&f.busca.trim()){ const q=f.busca.trim().toLowerCase(); l=l.filter(c=>c.cliente.toLowerCase().includes(q)||(c.codigoSolic||'').toLowerCase().includes(q)||c.itens.some(it=>itemLabel(it).toLowerCase().includes(q))); }
  return l;
}
// Ordena os cards dentro de cada coluna por prioridade (Urgente → Alta → Média → Baixa);
// em caso de empate, o card mais antigo aparece primeiro. Se o usuário arrastar um card
// para uma posição específica dentro da coluna, essa posição manual (km) é respeitada
// até que a prioridade do card seja alterada ou ele mude de coluna.
const PESO_PRIORIDADE={'Urgente':0,'Alta':1,'Média':2,'Baixa':3};
function chaveKanban(c){
  if(typeof c.km==='number') return c.km;
  const peso=PESO_PRIORIDADE[c.prioridade||'Média']??2;
  return peso*1e13+new Date(c.data).getTime();
}
function ordemPrioridadeKanban(a,b){ return chaveKanban(a)-chaveKanban(b); }
// Posiciona um card no fim da fila da própria prioridade dentro de "Recebimento" — chamado
// sempre que um card entra (ou volta a entrar) nessa coluna: card novo, resgate do arquivo,
// ou remanejamento manual de volta para Recebimento. Garante que ele fique logo abaixo do
// último card da MESMA prioridade (Urgente atrás do último Urgente, Baixa atrás do último
// Baixa etc.), respeitando quem já estava esperando há mais tempo — mesmo que a ordem
// desses cards já tenha sido ajustada manualmente (arrastada) antes.
function posicionarNoFimDaPrioridade(card){
  const peso=PESO_PRIORIDADE[card.prioridade||'Média']??2;
  const mesmaPrioridade=kanbanAtivos().filter(c=>c!==card&&c.col==='Recebimento'&&(PESO_PRIORIDADE[c.prioridade||'Média']??2)===peso);
  if(mesmaPrioridade.length===0){ card.km=null; return; } // ninguém da mesma prioridade na fila: ordenação automática já resolve
  card.km=Math.max(...mesmaPrioridade.map(chaveKanban))+1e6;
}
// ---------------- PREVISÃO AUTOMÁTICA DA FILA (Recebimento → Serviço) ----------------
// A coluna "Recebimento" funciona como uma fila por prioridade: o primeiro card da fila
// (Urgente → Alta → Média → Baixa; empate = mais antigo primeiro) é o próximo a entrar em
// Serviço. Ao entrar em Serviço, o card consome o SLA (dias) da sua tecnologia. Como só um
// card "ocupa" o posto de Serviço por vez, a previsão de cada card na fila é a data em que
// o posto ficará livre (quando o card da frente terminar) somada ao próprio SLA do card —
// exatamente como uma fila de atendimento sequencial.
// Cards que já saíram de Recebimento (Serviço/Aguardando/Teste) mantêm a previsão que já
// tinham (compromisso já assumido); só os que ainda estão na fila são recalculados aqui.
// Cards novos entram no fim da fila da própria prioridade automaticamente, pois
// chaveKanban() usa o timestamp de criação como critério de desempate.
// Se o técnico editar a previsão manualmente (c.previsaoManual=true), esse card é
// respeitado e não é sobrescrito — mas os cards seguintes da fila continuam a partir
// da data que ele informou, para a fila continuar fazendo sentido.
function recalcularPrevisoesFila(){
  const ativos=kanbanAtivos();
  const emServico=ativos.filter(c=>c.col==='Serviço');
  let cursor=todayStr();
  emServico.forEach(c=>{ if(c.previsao&&c.previsao>cursor) cursor=c.previsao; });
  const fila=ativos.filter(c=>c.col==='Recebimento').sort(ordemPrioridadeKanban);
  fila.forEach(c=>{
    if(c.previsaoManual&&c.previsao){ if(c.previsao>cursor) cursor=c.previsao; return; }
    cursor=addDiasData(cursor,Math.ceil(slaDoCard(c)));
    c.previsao=cursor;
  });
}
// Prevê a previsão de conclusão de um card que AINDA NÃO existe no Kanban, simulando sua
// entrada no fim da fila da própria prioridade (mesma regra usada em recalcularPrevisoesFila).
// Usado para mostrar ao técnico, antes de confirmar o envio, quando o equipamento deve
// ficar pronto — sem alterar nada no board de verdade.
function previsaoSugeridaNovoCard(prioridade,itens){
  const ativos=kanbanAtivos();
  const emServico=ativos.filter(c=>c.col==='Serviço');
  let cursor=todayStr();
  emServico.forEach(c=>{ if(c.previsao&&c.previsao>cursor) cursor=c.previsao; });
  const pesoNovo=PESO_PRIORIDADE[prioridade||'Média']??2;
  const fila=ativos.filter(c=>c.col==='Recebimento').sort(ordemPrioridadeKanban);
  fila.forEach(c=>{
    const pesoC=PESO_PRIORIDADE[c.prioridade||'Média']??2;
    if(pesoC>pesoNovo) return; // card com prioridade mais baixa: o novo card entra antes dele, não afeta a conta
    if(c.previsaoManual&&c.previsao){ if(c.previsao>cursor) cursor=c.previsao; return; }
    cursor=addDiasData(cursor,Math.ceil(slaDoCard(c)));
  });
  return addDiasData(cursor,Math.ceil(slaDoCard({itens})));
}
// Reposiciona um card no ponto onde foi solto dentro da coluna (posição manual).
function posicionarCardNoDrop(card,zone,clientY){
  const outros=[...zone.querySelectorAll('.kcard')].map(el=>Number(el.dataset.id)).filter(id=>id!==card.id)
    .map(id=>state.kanbanCards.find(x=>x.id===id)).filter(Boolean);
  if(outros.length===0){ card.km=null; return; }
  let idx=outros.length;
  const els=[...zone.querySelectorAll('.kcard')].filter(el=>Number(el.dataset.id)!==card.id);
  for(let i=0;i<els.length;i++){ const r=els[i].getBoundingClientRect(); if(clientY<r.top+r.height/2){ idx=i; break; } }
  const antes=idx>0?chaveKanban(outros[idx-1]):null;
  const depois=idx<outros.length?chaveKanban(outros[idx]):null;
  if(antes==null) card.km=depois-1e9;
  else if(depois==null) card.km=antes+1e9;
  else card.km=(antes+depois)/2;
}

function statsEquipPecas(cards){
  let eqTotal=0,eqDone=0,pcTotal=0,pcDone=0;
  (cards||[]).forEach(c=>(c.itens||[]).forEach(it=>{
    const total=(it.doneUnits?it.doneUnits.length:it.qtd)||0;
    const done=it.doneUnits?it.doneUnits.filter(Boolean).length:0;
    if(it.kind==='peca'){ pcTotal+=total; pcDone+=done; } else { eqTotal+=total; eqDone+=done; }
  }));
  return {eqTotal,eqDone,eqPend:eqTotal-eqDone,pcTotal,pcDone,pcPend:pcTotal-pcDone};
}

// ---------------- DASHBOARD ----------------
function renderDashboard(){
  const mes=state.dashMes;
  const meses=Array.from(new Set([...state.solicitacoes.map(r=>ymDeData(r.data)),...state.kanbanCards.map(c=>ymDeData(c.data))])).sort().reverse();
  const noMes=(d)=>!mes||ymDeData(d)===mes;
  const solic=state.solicitacoes.filter(r=>noMes(r.data));
  const cards=state.kanbanCards.filter(c=>noMes(c.data));
  const concl=cards.filter(c=>c.col==='Concluído'||c.arquivado);
  const andamento=cards.filter(c=>!(c.col==='Concluído'||c.arquivado));
  const pendSolic=solic.filter(r=>r.status==='Novo'&&!r.arquivada);

  // ---- unidades de equipamentos e peças no período selecionado (mesma régua do Kanban) ----
  const s=statsEquipPecas(cards);

  // ---- taxas ----
  const anoRef = mes ? mes.slice(0,4) : String(new Date().getFullYear());
  const mesRef = mes || mesAtual();
  const cardsMesRef = state.kanbanCards.filter(c=>ymDeData(c.data)===mesRef);
  const cardsAnoRef = state.kanbanCards.filter(c=>ymDeData(c.data).slice(0,4)===anoRef);
  const sMes=statsEquipPecas(cardsMesRef), sAno=statsEquipPecas(cardsAnoRef);
  const pct=(a,b)=>b>0?Math.round(a/b*100):0;
  const totalMes=sMes.eqTotal+sMes.pcTotal, doneMes=sMes.eqDone+sMes.pcDone;
  const totalAno=sAno.eqTotal+sAno.pcTotal, doneAno=sAno.eqDone+sAno.pcDone;
  const txConclMes=pct(doneMes,totalMes);
  const txConclAno=pct(doneAno,totalAno);
  const txPend=pct(s.eqPend+s.pcPend, s.eqTotal+s.pcTotal);

  // ---- SOBRECARGA REALISTA: pool compartilhado de 3 técnicos, em horário comercial ----
  // Os 3 técnicos atuam em QUALQUER demanda (não são postos fixos por tecnologia) — é possível
  // até os 3 trabalharem na mesma tecnologia ao mesmo tempo (ex.: 3x CIJ simultâneos), mas isso
  // não é a regra. Por isso a capacidade é um POOL único de "técnico-dias úteis", e não uma soma
  // de capacidades por tecnologia (que superestimaria a capacidade real, pois os mesmos 3
  // técnicos não podem estar em 7 tecnologias diferentes ao mesmo tempo).
  // Expediente: segunda a sexta, 08h–17h — só contamos dias úteis (sem fins de semana).
  const TECNICOS_TOTAL=3;
  const JANELA_RECENTE_DIAS=60; // "Todos os meses": mede o ritmo dos últimos 60 dias corridos,
  // não desde o primeiro card já criado — senão anos de histórico diluem uma piora recente e
  // a taxa de sobrecarga fica artificialmente otimista (foi exatamente o que gerou o -89%/-14%
  // que não batiam com o backlog real de 51 equipamentos).
  function ehDiaUtil(d){ const dow=d.getDay(); return dow!==0&&dow!==6; }
  function diasUteisEntre(inicio,fim){ if(fim<inicio) return 0; let n=0; const d=new Date(inicio); while(d<=fim){ if(ehDiaUtil(d)) n++; d.setDate(d.getDate()+1);} return n; }
  // custo em "técnico-dias" para concluir 1 unidade (o SLA já é medido em dias de expediente).
  // Itens sem tecnologia reconhecida (campo vazio/não preenchido) usam o SLA médio como estimativa
  // — antes eles eram simplesmente ignorados na conta, o que subestimava backlog e demanda.
  const custoTecnicoDia={}; Object.keys(SLA_TECNOLOGIA).forEach(t=>custoTecnicoDia[t]=SLA_TECNOLOGIA[t]);
  const custoTecnicoDiaPeca=1/CAPACIDADE_PECAS_DIA;
  function custoDe(tech){ return custoTecnicoDia[tech]!=null?custoTecnicoDia[tech]:SLA_PECAS_PADRAO; }

  // backlog ATUAL (independe do filtro de mês — é a fila real hoje), por tecnologia
  const pendTechAtual={}; let pendPecasAtual=0;
  state.kanbanCards.forEach(c=>(c.itens||[]).forEach(it=>{
    const total=(it.doneUnits?it.doneUnits.length:it.qtd)||0;
    const done=it.doneUnits?it.doneUnits.filter(Boolean).length:0;
    const pend=total-done; if(pend<=0) return;
    if(it.kind==='peca'){ pendPecasAtual+=pend; } else { const t=it.tecnologia||'Sem tecnologia'; pendTechAtual[t]=(pendTechAtual[t]||0)+pend; }
  }));

  // janela usada para medir o RITMO de entradas (demanda/dia): o mês selecionado, ou os
  // últimos 60 dias corridos quando "Todos os meses" está selecionado (ver nota acima)
  const hojeStr=todayStr();
  const hojeDate=new Date(hojeStr);
  let diasUteisPeriodo, cardsJanelaDemanda;
  if(mes){
    const [ay,am]=mes.split('-').map(Number);
    const inicioMes=new Date(ay,am-1,1);
    const fimMes=new Date(ay,am,0);
    const fimReal=(mes===ymDeData(hojeStr))?hojeDate:fimMes;
    diasUteisPeriodo=Math.max(1,diasUteisEntre(inicioMes,fimReal));
    cardsJanelaDemanda=cards; // já filtrados pelo mês selecionado
  } else {
    const inicioJanela=new Date(hojeDate); inicioJanela.setDate(inicioJanela.getDate()-(JANELA_RECENTE_DIAS-1));
    diasUteisPeriodo=Math.max(1,diasUteisEntre(inicioJanela,hojeDate));
    cardsJanelaDemanda=state.kanbanCards.filter(c=>{ const dia=diaDeData(c.data); return dia>=diaDeData(inicioJanela)&&dia<=hojeStr; });
  }

  // entradas na janela de demanda, por tecnologia e peças
  const entradaTech={}; let entradaPecas=0;
  cardsJanelaDemanda.forEach(c=>(c.itens||[]).forEach(it=>{
    const total=(it.doneUnits?it.doneUnits.length:it.qtd)||0;
    if(it.kind==='peca'){ entradaPecas+=total; } else { const t=it.tecnologia||'Sem tecnologia'; entradaTech[t]=(entradaTech[t]||0)+total; }
  }));

  // união de tecnologias conhecidas + qualquer tecnologia/rótulo que apareça nos dados (ex.: itens
  // sem tecnologia preenchida) — assim nenhum equipamento pendente fica de fora da conta
  const todasTechsPresentes=Array.from(new Set([...Object.keys(SLA_TECNOLOGIA),...Object.keys(pendTechAtual),...Object.keys(entradaTech)]));
  // técnico-dias que cada tecnologia consome do pool (demanda da janela e backlog atual)
  const consumoPorTech=todasTechsPresentes.map(t=>{
    const entradas=entradaTech[t]||0;
    const pend=pendTechAtual[t]||0;
    const custo=custoDe(t);
    return {
      tech:t, entradas, pend, custo,
      tecDiasDemanda: entradas*custo,
      tecDiasBacklog: pend*custo,
      capacidadeMaxTech: TECNICOS_TOTAL/custo, // teto teórico se os 3 técnicos dedicassem 100% do dia a essa tecnologia (ex.: 3x CIJ em paralelo)
    };
  });
  const tecDiasDemandaPecas=entradaPecas*custoTecnicoDiaPeca;
  const tecDiasBacklogPecas=pendPecasAtual*custoTecnicoDiaPeca;

  // pool total disponível na janela: 3 técnicos × dias úteis
  const capacidadePoolPeriodo=TECNICOS_TOTAL*diasUteisPeriodo;
  const demandaPoolPeriodo=consumoPorTech.reduce((s,r)=>s+r.tecDiasDemanda,0)+tecDiasDemandaPecas;
  const txSobre=capacidadePoolPeriodo>0?Math.round((demandaPoolPeriodo/capacidadePoolPeriodo-1)*100):0;

  // backlog total em técnico-dias e quantos DIAS ÚTEIS levaria pra zerar com os 3 técnicos full-time nisso
  const backlogTecnicoDiasTotal=consumoPorTech.reduce((s,r)=>s+r.tecDiasBacklog,0)+tecDiasBacklogPecas;
  const backlogDiasGeral=backlogTecnicoDiasTotal/TECNICOS_TOTAL;

  // % do pool de demanda que cada tecnologia representa — mostra onde a pressão está concentrada
  const pesoPorTech=consumoPorTech.map(r=>({...r,pesoPct:demandaPoolPeriodo>0?Math.round(r.tecDiasDemanda/demandaPoolPeriodo*100):0})).sort((a,b)=>b.tecDiasBacklog-a.tecDiasBacklog);
  const pesoPctPecas=demandaPoolPeriodo>0?Math.round(tecDiasDemandaPecas/demandaPoolPeriodo*100):0;


  // ---- gráfico: valores de cada mês do ano (unidades: concluídas x pendentes) ----
  const anosDisp=Array.from(new Set(state.kanbanCards.map(c=>ymDeData(c.data).slice(0,4)))).sort().reverse();
  const anoGraf=state.dashAno||anoRef;
  const MESES_NOMES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const porMesAno=MESES_NOMES.map((nome,i)=>{
    const ym=anoGraf+'-'+String(i+1).padStart(2,'0');
    const cs=state.kanbanCards.filter(c=>ymDeData(c.data)===ym);
    const st=statsEquipPecas(cs);
    const total=st.eqTotal+st.pcTotal, done=st.eqDone+st.pcDone;
    return {nome,total,done,pend:total-done};
  });
  const maxMesAno=Math.max(1,...porMesAno.map(m=>m.total));
  const barAno=porMesAno.map(m=>`
    <div class="bar-row"><span class="bl">${m.nome}</span>
      <div class="stack">${m.done?`<div class="s-done" style="width:${m.done/maxMesAno*100}%"></div>`:''}${m.pend?`<div class="s-run" style="width:${m.pend/maxMesAno*100}%"></div>`:''}</div>
      <span class="bv">${m.total||''}</span></div>`).join('');

  // ---- gráfico por tipo de atendimento (unidades: total, concluído, pendente) ----
  const tipoMap={};
  cards.forEach(c=>{ const t=c.tipo||'Sem tipo'; if(!tipoMap[t]) tipoMap[t]={total:0,done:0}; c.itens.forEach(it=>{ const tt=(it.doneUnits?it.doneUnits.length:it.qtd)||0; const dd=it.doneUnits?it.doneUnits.filter(Boolean).length:0; tipoMap[t].total+=tt; tipoMap[t].done+=dd; }); });
  const tipos=Object.entries(tipoMap).sort((a,b)=>b[1].total-a[1].total);
  const maxTipo=Math.max(1,...tipos.map(([,v])=>v.total));
  const barTipo=tipos.length?tipos.map(([t,v])=>{ const pendT=v.total-v.done; return `
    <div class="bar-row bar-row-tipo"><span class="bl" title="${escapeHtml(t)}">${escapeHtml(t)}</span>
      <div class="stack">${v.done?`<div class="s-done" style="width:${v.done/maxTipo*100}%"></div>`:''}${pendT?`<div class="s-run" style="width:${pendT/maxTipo*100}%"></div>`:''}</div>
      <span class="bv">${v.done}✓ ${pendT}⏳ ${v.total}</span></div>`; }).join(''):`<p class="req-sub">Sem dados.</p>`;

  // quantidade por modelo (unidades em itens de modelo)
  const modeloMap={};
  cards.forEach(c=>c.itens.forEach(it=>{ if(it.kind!=='peca'){ modeloMap[it.modelo]=(modeloMap[it.modelo]||0)+(it.doneUnits?it.doneUnits.length:it.qtd); } }));
  const modelos=Object.entries(modeloMap).sort((a,b)=>b[1]-a[1]);
  const maxMod=Math.max(1,...modelos.map(m=>m[1]));

  // peças por código
  const pecaMap={};
  cards.forEach(c=>c.itens.forEach(it=>{ if(it.kind==='peca'){ const q=(it.doneUnits?it.doneUnits.length:it.qtd); pecaMap[it.codigo]=(pecaMap[it.codigo]||0)+q; } }));
  const pecas=Object.entries(pecaMap).sort((a,b)=>b[1]-a[1]);
  const maxPeca=Math.max(1,...pecas.map(p=>p[1]));

  const barMod=modelos.length?modelos.map(([k,v])=>`<div class="bar-row"><span class="bl">${escapeHtml(k)}</span><div class="bar-track"><div class="bar-fill" style="width:${v/maxMod*100}%"></div></div><span class="bv">${v}</span></div>`).join(''):`<p class="req-sub">Sem dados.</p>`;
  const barPeca=pecas.length?pecas.map(([k,v])=>`<div class="bar-row"><span class="bl">${escapeHtml(k)}</span><div class="bar-track"><div class="bar-fill v" style="width:${v/maxPeca*100}%"></div></div><span class="bv">${v}</span></div>`).join(''):`<p class="req-sub">Nenhuma peça registrada.</p>`;

  // ---- MÉTRICA (TESTE): produtividade por dia e por técnico ----
  // Base: cards CONCLUÍDOS (têm dataConclusao). As unidades do card são creditadas
  // ao dia em que o card foi concluído e ao técnico responsável por ele.
  // Equipamentos e peças são contados SEPARADAMENTE.
  const concluidosComData = state.kanbanCards.filter(c=>c.dataConclusao && (!mes || ymDeData(c.dataConclusao)===mes));
  const equipDoCard = c => (c.itens||[]).reduce((s,it)=>s+(it.kind!=='peca'?((it.doneUnits?it.doneUnits.length:it.qtd)||0):0),0);
  const pecaDoCard  = c => (c.itens||[]).reduce((s,it)=>s+(it.kind==='peca'?((it.doneUnits?it.doneUnits.length:it.qtd)||0):0),0);

  // por dia
  const porDia={};
  concluidosComData.forEach(c=>{ const d=diaDeData(c.dataConclusao); if(!porDia[d]) porDia[d]={eq:0,pc:0,cards:0}; porDia[d].eq+=equipDoCard(c); porDia[d].pc+=pecaDoCard(c); porDia[d].cards++; });
  const diasOrd=Object.keys(porDia).sort(); // todos os dias do período filtrado no dashboard
  const maxDia=Math.max(1,...diasOrd.map(d=>porDia[d].eq+porDia[d].pc));
  const totalEqConcl=concluidosComData.reduce((s,c)=>s+equipDoCard(c),0);
  const totalPcConcl=concluidosComData.reduce((s,c)=>s+pecaDoCard(c),0);
  const nDias=Object.keys(porDia).length;
  const mediaEqDia = nDias>0 ? (totalEqConcl/nDias) : 0;
  const mediaPcDia = nDias>0 ? (totalPcConcl/nDias) : 0;
  const barDia = diasOrd.length?diasOrd.map(d=>{
    const v=porDia[d]; const [yy,mm,dd]=d.split('-');
    return `<div class="bar-row bar-row-tipo"><span class="bl">${dd}/${mm}</span>
      <div class="stack">${v.eq?`<div class="s-done" style="width:${v.eq/maxDia*100}%"></div>`:''}${v.pc?`<div class="s-run" style="width:${v.pc/maxDia*100}%"></div>`:''}</div>
      <span class="bv">${v.eq}🔧 ${v.pc}🔩</span></div>`;
  }).join(''):`<p class="req-sub">Nenhum card concluído no período — a métrica aparece conforme os cards forem concluídos.</p>`;

  // nova escala: 0% = demanda igual à capacidade (equilíbrio); negativo = folga; positivo = sobrecarga
  // positivo (sobrecarregado) = vermelho, negativo (folga) = verde, 0 = neutro
  const sobreCls = txSobre>0?'alto':txSobre<0?'ok':'meio';
  return `
    <div class="controls" style="margin-bottom:10px;">
      <span class="page-label">Dashboard</span>
      <select class="ctrl" onchange="setDashMes(this.value)"><option value="">Todos os meses</option>${meses.map(ym=>`<option value="${ym}" ${mes===ym?'selected':''}>${mesLabel(ym)}</option>`).join('')}</select>
      <span class="spacer"></span>
    </div>

    <div class="dash-top">
      <div class="kpi-group">
        <div class="kpi-group-title">Solicitações</div>
        <div class="kpi-group-nums">
          <div class="kpi-mini"><b>${solic.length}</b><small>Total</small></div>
          <div class="kpi-mini pend"><b>${pendSolic.length}</b><small>Pendentes</small></div>
          <div class="kpi-mini done"><b>${solic.filter(r=>r.arquivada).length}</b><small>Atendidas</small></div>
        </div>
      </div>
      <div class="kpi-group">
        <div class="kpi-group-title">Equipamentos <small>(un.)</small></div>
        <div class="kpi-group-nums">
          <div class="kpi-mini"><b>${s.eqTotal}</b><small>Total</small></div>
          <div class="kpi-mini done"><b>${s.eqDone}</b><small>Concluídos</small></div>
          <div class="kpi-mini pend"><b>${s.eqPend}</b><small>Pendentes</small></div>
        </div>
      </div>
      <div class="kpi-group">
        <div class="kpi-group-title">Peças <small>(un.)</small></div>
        <div class="kpi-group-nums">
          <div class="kpi-mini"><b>${s.pcTotal}</b><small>Total</small></div>
          <div class="kpi-mini done"><b>${s.pcDone}</b><small>Concluídas</small></div>
          <div class="kpi-mini pend"><b>${s.pcPend}</b><small>Pendentes</small></div>
        </div>
      </div>
      <div class="kpi-group taxas">
        <div class="kpi-group-title">Taxas</div>
        <div class="kpi-group-nums">
          <div class="kpi-mini" title="Conclusão mensal · ${doneMes}/${totalMes} unidades em ${mesLabel(mesRef).replace(' de ',' ')}"><b>${txConclMes}%</b><small>Concl. mês</small></div>
          <div class="kpi-mini" title="Conclusão anual · ${doneAno}/${totalAno} unidades em ${anoRef}"><b>${txConclAno}%</b><small>Concl. ano</small></div>
          <div class="kpi-mini pend" title="Pendência · ${s.eqPend+s.pcPend}/${s.eqTotal+s.pcTotal} unidades em aberto"><b>${txPend}%</b><small>Pendência</small></div>
          <div class="kpi-mini sobre-${sobreCls}" title="Sobrecarga = demanda do período (em técnico-dias) ÷ capacidade do pool (3 técnicos × dias úteis do período) − 100%. 0% = equilíbrio; considera só seg–sex, 08h–17h."><b>${txSobre>0?'+':''}${txSobre}%</b><small>Sobrecarga</small></div>
          <div class="kpi-mini pend" title="Backlog atual (todas as filas, em técnico-dias) ÷ 3 técnicos — quantos dias úteis levaria pra zerar tudo que está pendente hoje, se os 3 se dedicassem só a isso, sem novas entradas"><b>${backlogDiasGeral.toFixed(1)}</b><small>Dias úteis p/ zerar fila</small></div>
        </div>
      </div>
    </div>

    <div class="dash-grid dash-grid-compact">
      <div class="panel panel-c"><h3>Unidades por mês do ano ${anosDisp.length>1?`<select class="ctrl ctrl-sm" style="float:right;" onchange="setDashAno(this.value)">${anosDisp.map(a=>`<option value="${a}" ${anoGraf===a?'selected':''}>${a}</option>`).join('')}</select>`:`· ${anoGraf}`}</h3>${barAno}<div class="legend"><span><i style="background:var(--success)"></i>Concluídas</span><span><i style="background:var(--accent)"></i>Pendentes</span></div></div>
      <div class="panel panel-c"><h3>Por tipo de atendimento <small style="font-weight:500;color:var(--ink-soft);">(unidades)</small></h3>${barTipo}<div class="legend"><span><i style="background:var(--success)"></i>Concluídas</span><span><i style="background:var(--accent)"></i>Pendentes</span><span>✓ concl. · ⏳ pend. · último nº = total</span></div></div>
      <div class="panel panel-c"><h3>Quantidade por modelo</h3>${barMod}</div>
      <div class="panel panel-c"><h3>Ranking de peças por código</h3>${barPeca}</div>

      <div class="panel panel-c" style="grid-column:1 / -1;">
        <h3>Consumo do pool de técnicos por tecnologia <small style="font-weight:500;color:var(--ink-soft);">3 técnicos · seg–sex 08h–17h · ritmo medido em ${diasUteisPeriodo} dia(s) úteis${mes?` (${mesLabel(mes)})`:` (últimos ${JANELA_RECENTE_DIAS} dias corridos)`} · backlog é sempre o total pendente hoje</small></h3>
        <table class="sobre-table">
          <thead><tr><th>Tecnologia</th><th>SLA/custo</th><th>Entradas</th><th>Téc.-dias consumidos</th><th>% do pool</th><th>Pendentes</th><th>Backlog (téc.-dias)</th><th>Teto c/ 3 técnicos</th></tr></thead>
          <tbody>
            ${pesoPorTech.map(r=>`<tr${r.tech==='Sem tecnologia'?' style="opacity:.75;"':''}>
              <td><span class="tech-dot" style="background:${r.tech==='Sem tecnologia'?'#8a8f99':techHex(r.tech)}"></span>${escapeHtml(r.tech)}${r.tech==='Sem tecnologia'?' <span title="Itens sem tecnologia definida — usando o SLA médio como estimativa até serem classificados">⚠️</span>':''}</td>
              <td class="mono">${r.custo.toFixed(2)}d</td>
              <td class="mono">${r.entradas}</td>
              <td class="mono">${r.tecDiasDemanda.toFixed(1)}</td>
              <td class="mono sobre-cell-${r.pesoPct>40?'alto':r.pesoPct>20?'meio':'ok'}">${r.pesoPct}%</td>
              <td class="mono">${r.pend}</td>
              <td class="mono">${r.tecDiasBacklog.toFixed(1)}</td>
              <td class="mono">${r.capacidadeMaxTech.toFixed(1)}/d</td>
            </tr>`).join('')}
            <tr>
              <td><span class="tech-dot" style="background:var(--peca)"></span>Peças</td>
              <td class="mono">—</td>
              <td class="mono">${entradaPecas}</td>
              <td class="mono">${tecDiasDemandaPecas.toFixed(1)}</td>
              <td class="mono sobre-cell-${pesoPctPecas>40?'alto':pesoPctPecas>20?'meio':'ok'}">${pesoPctPecas}%</td>
              <td class="mono">${pendPecasAtual}</td>
              <td class="mono">${tecDiasBacklogPecas.toFixed(1)}</td>
              <td class="mono">${CAPACIDADE_PECAS_DIA.toFixed(1)}/d</td>
            </tr>
          </tbody>
        </table>
        <div class="legend" style="margin-top:8px;">
          <span>Téc.-dias = "dias de um técnico" que a demanda consome (SLA em equipamentos · 1/3,3 em peças) · % do pool = fatia da demanda da janela que essa tecnologia representa, do total consumido pelos 3 técnicos · Teto c/ 3 técnicos = capacidade máxima teórica se os 3 dedicassem 100% do expediente só a essa tecnologia (ex.: até 3x CIJ em paralelo) — na prática o pool é compartilhado com as outras demandas.</span>
        </div>
      </div>

      ${podeVerProdutividade()?`
      <div class="panel panel-c"><h3>Produtividade por dia <small style="font-weight:500;color:var(--ink-soft);">${mes?mesLabel(mes):'todos os meses'}</small></h3>
        <div class="kpi-group-nums" style="margin-bottom:10px;">
          <div class="kpi-mini done"><b>${totalEqConcl}</b><small>🔧 Equip.</small></div>
          <div class="kpi-mini"><b>${mediaEqDia.toFixed(1)}</b><small>Equip./dia</small></div>
          <div class="kpi-mini done"><b>${totalPcConcl}</b><small>🔩 Peças</small></div>
          <div class="kpi-mini"><b>${mediaPcDia.toFixed(1)}</b><small>Peças/dia</small></div>
          <div class="kpi-mini"><b>${nDias}</b><small>Dias c/ entrega</small></div>
        </div>
        ${barDia}
        <div class="legend"><span><i style="background:var(--success)"></i>Equipamentos</span><span><i style="background:var(--accent)"></i>Peças</span><span>creditados ao dia da conclusão do card · período conforme o filtro do dashboard</span></div>
      </div>`:''}
    </div>`;
}

function toggleUserPerm(userId,aba,tipo){
  if(!requireEdit('usuarios')) { render(); return; }
  const u=state.usuarios.find(x=>x.id===userId); if(!u) return;
  u.permissoes[aba][tipo]=!u.permissoes[aba][tipo];
  if(tipo==='editar'&&u.permissoes[aba][tipo]) u.permissoes[aba].ver=true;
  if(tipo==='ver'&&!u.permissoes[aba][tipo]) u.permissoes[aba].editar=false;
  logAtv(`Permissões de ${u.nome} em ${ABA_LABEL[aba]} atualizadas.`);
  render();
}
function toggleUserAtivo(userId){
  if(!requireEdit('usuarios')) return;

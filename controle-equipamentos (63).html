async function salvarUsuario(){
  const d=state.draftUsuario;
  const usuario=(d.usuario||'').trim().toLowerCase();
  const nome=(d.nome||'').trim();
  if(!nome){ alert('Informe o nome do usuário.'); return; }
  if(!usuario){ alert('Informe o login do usuário.'); return; }
  let usuarioAlvo;
  if(!d.id){
    if(state.usuarios.some(u=>u.usuario===usuario)){ alert('Já existe um usuário com esse login.'); return; }
    if(!d.senha||d.senha.length<4){ alert('Defina uma senha inicial com ao menos 4 caracteres.'); return; }
    usuarioAlvo=novoUsuario(usuario,d.senha,nome,d.permissoes,d.ativo,d.verTodasSolic,(d.email||'').trim(),d.verProdutividade);
    state.usuarios.push(usuarioAlvo);
    logAtv(`Usuário "${nome}" (@${usuario}) criado.`);
  } else {
    const u=state.usuarios.find(x=>x.id===d.id); if(!u) return;
    u.nome=nome; u.ativo=d.ativo; u.permissoes=d.permissoes; u.verTodasSolic=!!d.verTodasSolic; u.verProdutividade=!!d.verProdutividade; u.email=(d.email||'').trim();
    if(d.senha&&d.senha.trim()){ if(d.senha.length<4){ alert('A nova senha precisa ter ao menos 4 caracteres.'); return; } u.senha=d.senha; }
    usuarioAlvo=u;
    logAtv(`Usuário "${nome}" atualizado.`);
  }
  const btns=document.querySelectorAll('.modal-foot .btn-primary'); btns.forEach(b=>{ b.disabled=true; b.textContent='Salvando e confirmando...'; });
  const ok = await gravarUsuarioComConfirmacao(usuarioAlvo);
  if(ok){ closeModal(); showToast('Usuário salvo e confirmado na planilha'); }
  else {
    render();
    alert('O usuário foi enviado para a planilha, mas não conseguimos confirmar a gravação por uma instabilidade de conexão com o Google Sheets (veja o Console, F12, para detalhes técnicos). Ele PODE já estar salvo — feche esta tela, aguarde alguns segundos e confira na lista antes de tentar salvar de novo, para não duplicar. Se não aparecer, clique em "Editar" ou crie novamente.');
  }
}

function salvarTrocaSenhaInterna(){
  const atual=(document.getElementById('ts-atual')||{}).value||'';
  const nova=(document.getElementById('ts-nova')||{}).value||'';

function salvarSolicitacao(){
  if(!requireEdit('solicitacoes')) return;
  const d=state.draftForm;
  const cliente=(d.cliente||'').trim(),tipo=(d.tipo||'').trim();
  if(!cliente){ alert('Informe o nome do cliente.'); return; }
  if(!tipo){ alert('Informe o tipo de atendimento.'); return; }
  if(!isPecas(tipo)&&!(d.escopo||'').trim()){ alert('Descreva o escopo do equipamento — campo obrigatório.'); return; }
  let pecasNovas=[], equipNovos=[];
  if(isPecas(tipo)){
    pecasNovas=state.draftPecas.map(p=>({codigo:(p.codigo||'').trim(),qtd:Math.max(1,Number(p.qtd)||1)})).filter(p=>p.codigo);
    if(pecasNovas.length===0){ alert('Adicione ao menos uma peça (código).'); return; }
  } else {
    equipNovos=state.draftEquip.map(e=>({modelo:(e.modelo||'').trim(),qtd:Math.max(1,Number(e.qtd)||1)})).filter(e=>e.modelo);
    if(equipNovos.length===0){ alert('Adicione ao menos um modelo de equipamento.'); return; }
  }
  // ----- MODO EDIÇÃO: altera material e reenvia para nova verificação -----
  if(state.editSolicId){
    const r=state.solicitacoes.find(x=>x.id===state.editSolicId);
    if(r){
      r.cliente=cliente; r.cidade=(d.cidade||'').trim(); r.uf=d.uf||''; r.tipo=tipo; r.prioridade=d.prioridade||'Média';
      r.escopo=isPecas(tipo)?'':(d.escopo||'').trim(); r.numSerie=isPecas(tipo)?(d.numSerie||'').trim():''; r.obs=(d.obs||'').trim();
      r.equipamentos = isPecas(tipo)?[]:equipNovos; r.pecas = isPecas(tipo)?pecasNovas:[];
      r.status='Novo'; r.arquivada=false; // volta ao fluxo para nova verificação
      logAtv(`Solicitação ${r.codigo||''} de "${cliente}" editada (material alterado, reenviada).`);
      notificar(`Solicitação ${r.codigo||''} editada e reenviada: ${cliente}.`,'nova');
      if(r.solicitanteUser){
        notificar(`🔄 Sua solicitação ${r.codigo} (${escapeHtml(cliente)}) foi atualizada com o novo material (${descricaoItensSolic(r)}) e reenviada para verificação. Assim que a equipe técnica confirmar a disponibilidade, avisaremos por aqui. Obrigado!`,'nova',r.solicitanteUser,{cliente:r.cliente,cidade:r.cidade});
      }
    }
    state.editSolicId=null; closeModal(); showToast('Solicitação atualizada e reenviada'); return;
  }
  // ----- MODO CRIAÇÃO -----
  const solicitante=state.currentUser.nome, solicitanteUser=state.currentUser.usuario;
  const novoId=nextSolicId++;
  const base={ id:novoId, codigo:'SOL-'+new Date().getFullYear()+'-'+String(novoId).padStart(4,'0'), cliente, cidade:(d.cidade||'').trim(), uf:d.uf||'', solicitante, solicitanteUser, tipo, prioridade:d.prioridade||'Média', escopo:isPecas(tipo)?'':(d.escopo||'').trim(), numSerie:isPecas(tipo)?(d.numSerie||'').trim():'', obs:(d.obs||'').trim(), tecnico:"", data:new Date(), status:'Novo', arquivada:false, equipamentos:equipNovos, pecas:pecasNovas };
  state.solicitacoes.push(base);
  logAtv(`Nova solicitação de "${cliente}" criada (${tipo}).`);
  notificar(`Nova solicitação: ${cliente} (${tipo}).`,'nova');
  if(base.solicitanteUser){
    notificar(`✅ Recebemos sua solicitação ${base.codigo} com sucesso! Itens: ${descricaoItensSolic(base)} — para ${cliente} (${tipo}). Nossa equipe técnica já vai verificar a disponibilidade e, em breve, você será avisado por aqui sobre o andamento. Obrigado!`,'nova',base.solicitanteUser,{cliente:base.cliente,cidade:base.cidade});
  }
  closeModal();
}

function updateSolicTecnico(id,val){ if(!requireEdit('solicitacoes')) return; const r=state.solicitacoes.find(x=>x.id===id); if(r){ r.tecnico=val; } }
function updateSolicPrioridade(id,p){ if(!requireEdit('solicitacoes')) return; const r=state.solicitacoes.find(x=>x.id===id); if(r){ r.prioridade=p; render(); } }
function excluirSolicitacao(id){ if(!requireEdit('solicitacoes')) return; const r=state.solicitacoes.find(x=>x.id===id); if(!r) return; pedirConfirmacao('Excluir solicitação',`Excluir a solicitação de "${r.cliente}"?`,()=>{ logAtv(`Solicitação de "${r.cliente}" excluída.`); state.solicitacoes=state.solicitacoes.filter(x=>x.id!==id); state.modal=null; render(); showToast('Solicitação excluída'); }); }

function unidadesTotaisSolic(r){ return itensDaSolic(r).reduce((s,e)=>s+dispUnitsDe(e).length,0); }
function notificarDisponibilidadeSolic(r){
  if(!r.solicitanteUser) return;
  const disp=unidadesDisponiveis(r), total=unidadesTotaisSolic(r), servico=isPecas(r.tipo)?'':' e já seguirá para o serviço';
  let msg;
  if(r.status==='Não Disponível'||disp===0){
    msg=`❌ Sobre sua solicitação ${r.codigo} (${escapeHtml(r.cliente)}): após verificação da nossa equipe técnica, no momento não temos o material solicitado disponível. Você pode EDITAR a solicitação para trocar o material/modelo e reenviar para nova verificação, ou ARQUIVÁ-LA se não for mais necessária. É só abrir a solicitação pelo código ${r.codigo} e escolher uma das opções. Ficamos à disposição!`;
  } else if(disp>=total){
    msg=`✅ Boa notícia sobre sua solicitação ${r.codigo} (${escapeHtml(r.cliente)}): temos o material disponível${servico}! Itens confirmados: ${descricaoItensSolic(r)}. Você será avisado sobre as próximas etapas.`;
  } else {
    msg=`⚠️ Atualização da sua solicitação ${r.codigo} (${escapeHtml(r.cliente)}): temos disponibilidade parcial. Seguiremos atendendo com os itens disponíveis (${disp} de ${total} unidade${total>1?'s':''})${servico}, e vamos verificar os itens restantes e retornar em seguida.`;
  }
  notificar(msg,'status',r.solicitanteUser,{cliente:r.cliente,cidade:r.cidade});
}
function marcarStatus(id,status){ if(!requireEdit('solicitacoes')) return; const r=state.solicitacoes.find(x=>x.id===id); if(!r)return; if(status==='Disponível'&&unidadesDisponiveis(r)<1){ alert('Marque ao menos uma unidade como disponível.'); return; } r.status=status; logAtv(`Solicitação de "${r.cliente}" marcada como ${status}.`); notificar(`${r.cliente}: solicitação ${status}.`,'status'); notificarDisponibilidadeSolic(r); if(status==='Disponível'&&!isPecas(r.tipo)){ abrirDisponibilizar(r); } else { if(status==='Disponível') showToast('Peças disponíveis — envie ao Kanban quando desejar.'); render(); } }
function reabrirDisponibilizar(id){ const r=state.solicitacoes.find(x=>x.id===id); if(r) abrirDisponibilizar(r); }
function abrirDisponibilizar(r){
  const peca=isPecas(r.tipo);
  const itens=itensDaSolic(r).map(e=>{ const qtd=dispUnitsDe(e).filter(x=>x===true).length; if(qtd<=0) return null; return peca?{kind:'peca',codigo:e.codigo,qtd,tecnologia:""}:{kind:'modelo',modelo:e.modelo,qtd,tecnologia:tecnologiaAutoDoModelo(e.modelo)}; }).filter(Boolean);
  if(itens.length===0){ alert('Nenhuma unidade disponível para enviar ao Kanban.'); return; }
  state.draftKanban={nf:"",previsao:"",previsaoManual:false,tecnico:r.tecnico||"",itens};
  state.modal={type:'disponibilizar',id:r.id}; render();
}

function confirmarEnvioKanban(solicId){
  if(!requireEdit('solicitacoes')||!requireEdit('kanban')) return;
  const r=state.solicitacoes.find(x=>x.id===solicId); const k=state.draftKanban; const peca=isPecas(r.tipo);
  const itens=k.itens.map(it=>{ const qtd=Math.max(1,Number(it.qtd)||1); if(peca){ return {kind:'peca',codigo:it.codigo,qtd,doneUnits:Array(qtd).fill(false)}; } if(!it.tecnologia) return null; return {kind:'modelo',modelo:it.modelo,tecnologia:it.tecnologia,qtd,doneUnits:Array(qtd).fill(false)}; }).filter(Boolean);
  if(itens.length===0){ alert(peca?'Confirme as peças.':'Defina a tecnologia de cada equipamento.'); return; }
  if(k.tecnico) r.tecnico=k.tecnico;
  const novoCard={ id:nextKanbanId++, fromSolicId:solicId, cliente:r.cliente, cidade:r.cidade, uf:r.uf, nf:(k.nf||'').trim(), itens, tipo:r.tipo, prioridade:r.prioridade||'Média', solicitante:r.solicitante, solicitanteUser:r.solicitanteUser||"", tecnico:r.tecnico||"", obs:r.obs, escopo:r.escopo||"", numSerie:r.numSerie||"", codigoSolic:r.codigo||"", previsao:(k.previsaoManual&&k.previsao)?k.previsao:"", previsaoManual:!!k.previsaoManual, dataSolicitacao:r.data, data:new Date(), dataConclusao:null, col:'Recebimento', arquivado:false };
  posicionarNoFimDaPrioridade(novoCard);
  state.kanbanCards.push(novoCard);
  r.arquivada=true; r.mesArquivo=mesAtual();
  logAtv(`"${r.cliente}" enviado ao Kanban e solicitação arquivada.`);
  notificar(`${r.cliente}: enviado ao Kanban (Recebimento).`,'status');
  closeModal(); state.page='kanban'; state.kanView='ativos'; render();
}

// Verifica lendo de volta da planilha se o usuário informado está realmente lá,
// com os mesmos dados que gravamos — o Apps Script pode responder "sucesso" numa
// requisição POST mesmo quando não grava nada de verdade, então confiar só na
// resposta do POST não é suficiente. Esta é a única forma confiável de saber.
async function verificarUsuarioGravado(usuarioEsperado){
  try{
    const res=await fetch(SHEETS_URL,{method:'GET'});
    const bruto=await res.text();
    let data=null;
    try{ data=JSON.parse(bruto); }catch(eParse){
      console.error('[diagnóstico usuários] GET não retornou JSON válido. Texto bruto da resposta:',bruto.slice(0,1000));
      return false;
    }
    if(!data||!Array.isArray(data.Usuarios)){
      const resumo = data ? Object.keys(data).map(k=>k+':'+(Array.isArray(data[k])?('array com '+data[k].length+' itens'):typeof data[k])).join(' | ') : '(resposta vazia)';
      console.error('[diagnóstico usuários] GET NÃO trouxe "Usuarios" como array. RESUMO DAS CHAVES RECEBIDAS ➜ '+resumo);
      return false;
    }
    console.log('[diagnóstico usuários] Usuarios na planilha agora ('+data.Usuarios.length+'):',data.Usuarios.map(u=>u.usuario));
    const achado=data.Usuarios.find(u=>String(u.id)===String(usuarioEsperado.id));
    if(!achado){ console.warn('[diagnóstico usuários] usuário id='+usuarioEsperado.id+' ("'+usuarioEsperado.usuario+'") NÃO está na planilha ainda.'); return false; }
    const bate = achado.usuario===usuarioEsperado.usuario
        && achado.nome===usuarioEsperado.nome
        && achado.senha===usuarioEsperado.senha
        && !!achado.ativo===!!usuarioEsperado.ativo;
    if(!bate) console.warn('[diagnóstico usuários] usuário encontrado mas com dados diferentes. Esperado:',usuarioEsperado,'Encontrado:',achado);
    return bate;
  }catch(e){ console.error('[diagnóstico usuários] falha ao ler planilha para verificar:',e); return false; }
}
// Grava a lista de usuários e só considera concluído depois de confirmar, lendo de
// volta a planilha, que o usuário-alvo está lá com os dados corretos. Tenta várias
// vezes com espera crescente, o que também resolve conflitos de concorrência quando
// duas pessoas mexem no cadastro de usuários ao mesmo tempo.
async function gravarUsuarioComConfirmacao(usuarioAlvo,tentativas){
  tentativas=tentativas||5;
  syncEmAndamento=true; // pausa o polling e o sync automático de outras abas nesse meio-tempo
  setSyncStatus('syncing');
  try{
    // Mescla com o que está na planilha agora antes de gravar, para não apagar um
    // usuário criado/editado por outro administrador nos últimos segundos.
    atualizarVersoes('Usuarios',state.usuarios);
    const remoto=await buscarRemotoBruto();
    state.usuarios=mesclarRegistros(state.usuarios,remoto?remoto.Usuarios:null,registrosBase.Usuarios);
    const euAtual=state.currentUser?state.usuarios.find(u=>u.id===state.currentUser.id):null; if(euAtual) state.currentUser=euAtual;
    usuarioAlvo=state.usuarios.find(u=>u.id===usuarioAlvo.id)||usuarioAlvo;
    for(let i=0;i<tentativas;i++){
      try{
        const res=await fetch(SHEETS_URL,{ method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({sheet:'Usuarios',data:state.usuarios}) });
        let corpo=''; try{ corpo=await res.text(); }catch(e2){}
        console.log('[diagnóstico usuários] POST tentativa '+(i+1)+' — status HTTP:',res.status,'redirected:',res.redirected,'url final:',res.url,'corpo da resposta:',corpo?corpo.slice(0,500):'(vazio)');
      }catch(err){
        console.error('[diagnóstico usuários] Erro de rede/CORS ao gravar usuário (tentativa '+(i+1)+'/'+tentativas+'):',err);
      }
      await new Promise(r=>setTimeout(r,1200+i*700));
      const confirmado=await verificarUsuarioGravado(usuarioAlvo);
      if(confirmado){
        lastSyncedHash.Usuarios=JSON.stringify(state.usuarios);
        registrarBase('Usuarios',state.usuarios);
        lastSyncTime=Date.now();
        setSyncStatus('ok');
        return true;
      }
      console.warn('Gravação do usuário ainda não confirmada na planilha, tentando novamente ('+(i+1)+'/'+tentativas+')...');
      if(i<tentativas-1) await new Promise(r=>setTimeout(r,800));
    }
    setSyncStatus('error');
    return false;
  } finally {
    syncEmAndamento=false;
  }
}

// ---------------- SINCRONIZAÇÃO COM GOOGLE SHEETS ----------------
let dadosCarregados=false;
let syncStatus='idle'; // idle | syncing | ok | error
let syncTimer=null;
let syncEmAndamento=false;
let lastSyncTime=0;
let retryTimer=null;
let pollTimer=null;
let pollEmAndamento=false;
let lastSyncedHash={Solicitacoes:'',Kanban:'',Historico:'',Notificacoes:'',Usuarios:''};

function normalizarDatas(arr,campo){ (arr||[]).forEach(x=>{ if(x[campo]) x[campo]=new Date(x[campo]); }); return arr||[]; }
function proximoId(arr){ return (arr||[]).reduce((m,x)=>Math.max(m,(Number(x.id)||0)+1),1); }
function amostraInicial(){ return { id:nextSolicId++, cliente:"Indústria Beta S.A.", cidade:"Cuiabá", uf:"MT", equipamentos:[{modelo:"1880",qtd:2}], pecas:[], solicitante:"Carlos Mendes", tipo:"LOCAÇÃO", prioridade:"Alta", obs:"Linha 2.", tecnico:"", data:new Date(), status:"Novo", arquivada:false }; }

async function carregarDados(tentativa){
  tentativa=tentativa||1;
  try{
    const res=await fetch(SHEETS_URL,{method:'GET'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    const temAlgo = data && (( data.Solicitacoes&&data.Solicitacoes.length)||(data.Kanban&&data.Kanban.length)||(data.Historico&&data.Historico.length)||(data.Notificacoes&&data.Notificacoes.length)||(data.Usuarios&&data.Usuarios.length));
    if(temAlgo){
      state.solicitacoes=normalizarDatas(data.Solicitacoes,'data');
      state.kanbanCards=normalizarDatas(normalizarDatas(data.Kanban,'data'),'dataConclusao');
      state.historico=normalizarDatas(data.Historico,'ts');
      state.notificacoes=normalizarDatas(data.Notificacoes,'ts');
      state.usuarios=(data.Usuarios&&data.Usuarios.length)?data.Usuarios:usuariosPadrao();
      nextSolicId=proximoId(state.solicitacoes);
      nextKanbanId=proximoId(state.kanbanCards);
      nextNotiId=proximoId(state.notificacoes);
      nextUserId=proximoId(state.usuarios);
    } else {
      // Planilha genuinamente vazia (primeiro uso do sistema) — aqui sim é seguro usar os dados de exemplo.
      state.solicitacoes.push(amostraInicial());
      state.usuarios=usuariosPadrao();
    }
    garantirCodigosSolic(); garantirFlagVerTodas(); limpezaNotificacoesUnica(); // gera códigos retroativos p/ solicitações antigas (determinístico: mesmo resultado em qualquer máquina)
    // Migração única: entradas antigas do Histórico não tinham "id" (o log era só
    // append-only). A sincronização por registro precisa de um id em cada item, então
    // atribuímos aqui de forma determinística (pela posição no array, que é igual em
    // qualquer máquina que carregue os mesmos dados) para não perder o histórico existente.
    state.historico.forEach((h,i)=>{ if(h&&h.id==null) h.id=i+1; });
    nextHistId=proximoId(state.historico);
    // Recupera do backup local (neste navegador) qualquer alteração recente que não tenha
    // sido confirmada na planilha — por exemplo, se a gravação falhou, a conexão caiu, ou a
    // aba foi fechada/recarregada antes da sincronização terminar. Sem isso, uma gravação
    // que falhasse silenciosamente perderia o trabalho pra sempre ao recarregar a página.
    recuperarBackupLocalSeNecessario();
    nextSolicId=Math.max(nextSolicId,proximoId(state.solicitacoes));
    nextKanbanId=Math.max(nextKanbanId,proximoId(state.kanbanCards));
    nextNotiId=Math.max(nextNotiId,proximoId(state.notificacoes));
    nextHistId=Math.max(nextHistId,proximoId(state.historico));
    nextUserId=Math.max(nextUserId,proximoId(state.usuarios));
    lastSyncedHash={ Solicitacoes:JSON.stringify(state.solicitacoes), Kanban:JSON.stringify(state.kanbanCards), Historico:JSON.stringify(state.historico), Notificacoes:JSON.stringify(state.notificacoes), Usuarios:JSON.stringify(state.usuarios) };
    registrarBase('Solicitacoes',data.Solicitacoes||[]); registrarBase('Kanban',data.Kanban||[]); registrarBase('Historico',(data.Historico||[]).slice(0,300)); registrarBase('Notificacoes',(data.Notificacoes||[]).slice(0,150)); registrarBase('Usuarios',data.Usuarios||[]);
    syncStatus='ok';
    dadosCarregados=true;
    restaurarSessao();
    render();
    iniciarAtualizacaoAutomatica();
  }catch(err){
    console.error('Falha ao carregar do Google Sheets (tentativa '+tentativa+'/5):',err);
    if(tentativa<5){
      // Provável instabilidade de rede/CORS passageira do Google Apps Script — tenta de novo
      // em vez de substituir por dados de exemplo (foi isso que apagava usuários reais:
      // o app caía nos dados de exemplo e depois sincronizava esses dados por cima da planilha real).
      setTimeout(()=>carregarDados(tentativa+1),1500*tentativa);
      return;
    }
    document.getElementById('app').innerHTML = `<div class="login-wrap"><div class="login-card" style="text-align:center;">
      <img class="logo" src="${LOGO}" alt="Videojet">
      <h1>Não foi possível carregar os dados</h1>
      <p>Houve uma falha de conexão com o Google Sheets após várias tentativas. Por segurança, o sistema não continua com dados de exemplo — isso poderia sobrescrever dados reais salvos na planilha.</p>
      <button class="btn btn-primary btn-block" onclick="location.reload()">Tentar novamente</button>
    </div></div>`;
  }
}

function snapshotParaNuvem(){
  return { Solicitacoes:state.solicitacoes, Kanban:state.kanbanCards, Historico:state.historico.slice(0,300), Notificacoes:state.notificacoes.slice(0,150), Usuarios:state.usuarios };
}
const CHAVE_ESTADO = { Solicitacoes:'solicitacoes', Kanban:'kanbanCards', Historico:'historico', Notificacoes:'notificacoes', Usuarios:'usuarios' };
// Última versão de cada registro (por id) que sabemos estar de fato gravada na planilha,
// SEM o carimbo de versão (_v). É a "base de comparação" usada para mesclar: serve tanto
// para saber o que este cliente alterou localmente quanto para diferenciar "registro novo
// vindo de outro usuário" de "registro que eu mesmo excluí" durante a mesclagem.
let registrosBase={Solicitacoes:{},Kanban:{},Historico:{},Notificacoes:{},Usuarios:{}};
function semVersao(o){ if(!o||typeof o!=='object') return o; const c=Object.assign({},o); delete c._v; return c; }
function registrarBase(nome,arr){
  const mapa={};
  (arr||[]).forEach(x=>{ if(x&&x.id!=null) mapa[String(x.id)]=JSON.stringify(semVersao(x)); });
  registrosBase[nome]=mapa;
}
// Carimba com um timestamp (_v) todo registro cujo conteúdo mudou desde a última base
// conhecida — é esse carimbo que permite, na mesclagem, saber qual versão de um mesmo
// registro é mais nova quando dois usuários alteram a mesma solicitação/card.
function atualizarVersoes(nome,arr){
  const base=registrosBase[nome]||{};
  (arr||[]).forEach(x=>{
    if(!x||x.id==null) return;
    const atual=JSON.stringify(semVersao(x));
    if(base[String(x.id)]!==atual) x._v=Date.now();
  });
}
function arrayLocalDaAba(nome){
  return nome==='Historico'?state.historico.slice(0,300):nome==='Notificacoes'?state.notificacoes.slice(0,150):state[CHAVE_ESTADO[nome]];
}
// Mescla os registros locais com os que vieram da planilha, registro a registro (por id),
// em vez de sobrescrever a aba inteira. Isso é o que resolve os cards que "somem" e as
// mudanças de status que "voltam": antes, quem gravasse por último apagava por cima
// qualquer alteração concorrente feita por outro usuário, mesmo em cards diferentes.
// Regras:
//  - registro existe dos dois lados -> fica o mais recente (maior _v);
//  - registro só existe localmente e nunca foi excluído por mim -> é novo aqui, mantém;
//  - registro só existe na nuvem e eu nunca soube dele -> outro usuário criou, traz para cá;
//  - registro que eu sabia que existia mas sumiu de um dos lados sem alteração depois
//    disso -> foi excluído de propósito (por mim ou por outro usuário), respeita a exclusão.
function mesclarRegistros(locais,remotos,base,ordem){
  base=base||{};
  const locMap=new Map(); (locais||[]).forEach(x=>{ if(x&&x.id!=null) locMap.set(String(x.id),x); });
  const remMap=new Map(); (remotos||[]).forEach(x=>{ if(x&&x.id!=null) remMap.set(String(x.id),x); });
  const ids=new Set([...locMap.keys(),...remMap.keys(),...Object.keys(base)]);
  const resultado=[];
  ids.forEach(id=>{
    const l=locMap.get(id), r=remMap.get(id), existiaAntes=Object.prototype.hasOwnProperty.call(base,id);
    if(l&&r){
      const lv=Number(l._v)||0, rv=Number(r._v)||0;
      resultado.push(rv>lv?r:l);
    } else if(l&&!r){
      const alterouDepoisDaBase = !existiaAntes || base[id]!==JSON.stringify(semVersao(l));
      if(alterouDepoisDaBase) resultado.push(l); // é novo aqui, ou foi editado depois de ter sumido do servidor -> preserva
    } else if(r&&!l){
      if(!existiaAntes) resultado.push(r); // novidade trazida por outro usuário
    }
  });
  // Histórico e Notificações são exibidos na própria ordem do array (mais recente primeiro,
  // por causa do unshift) — sem essa ordenação por id na mesma direção, a mesclagem
  // embaralharia a ordem cronológica dessas duas telas.
  resultado.sort((a,b)=>ordem==='desc'?(Number(b.id)||0)-(Number(a.id)||0):(Number(a.id)||0)-(Number(b.id)||0));
  return resultado;
}
function haAlteracoesPendentes(){
  return Object.keys(CHAVE_ESTADO).some(nome=>{
    const arr=arrayLocalDaAba(nome), base=registrosBase[nome]||{};
    if((arr||[]).length!==Object.keys(base).length) return true;
    return (arr||[]).some(x=>x&&x.id!=null&&base[String(x.id)]!==JSON.stringify(semVersao(x)));
  });
}
function scheduleSync(){
  if(!state.currentUser||!dadosCarregados) return;
  salvarBackupLocal();
  clearTimeout(syncTimer);
  syncTimer=setTimeout(syncAgora,700);
}
// ---------------- BACKUP LOCAL (proteção contra falha de gravação na planilha) ----------------
// Guarda, neste navegador, uma cópia do estado atual sempre que algo muda. Isso é o que
// permite recuperar um card/solicitação se a gravação na planilha falhar (conexão caiu,
// erro no Apps Script, aba fechada/recarregada antes de terminar) — sem isso, um "não
// salvou corretamente" seguido de um recarregamento de página perde o trabalho pra sempre,
// porque ele só existia na memória do navegador.
const BACKUP_KEY='controleEquip_backupLocal_v1';
const BACKUP_JANELA_MS=48*3600*1000; // só recupera automaticamente o que foi alterado nas últimas 48h
function salvarBackupLocal(){
  try{
    localStorage.setItem(BACKUP_KEY, JSON.stringify({ t:Date.now(), dados:snapshotParaNuvem() }));
  }catch(e){ /* localStorage indisponível/cheio: segue sem backup local, não é crítico */ }
}
function lerBackupLocal(){
  try{
    const bruto=localStorage.getItem(BACKUP_KEY);
    return bruto?JSON.parse(bruto):null;
  }catch(e){ return null; }
}
function recuperarBackupLocalSeNecessario(){
  const backup=lerBackupLocal();
  if(!backup||!backup.dados) return;
  const agora=Date.now();
  let recuperouAlgo=false;
  Object.keys(CHAVE_ESTADO).forEach(nome=>{
    const key=CHAVE_ESTADO[nome];
    if(!Array.isArray(state[key])) return;
    const doBackup=(backup.dados[nome]||[]).filter(x=>x&&x.id!=null&&(agora-(Number(x._v)||0))<BACKUP_JANELA_MS);
    doBackup.forEach(item=>{
      const idx=state[key].findIndex(y=>String(y.id)===String(item.id));
      if(idx>=0){
        const atualReg=state[key][idx];
        if((Number(item._v)||0)>(Number(atualReg._v)||0)){ state[key][idx]=item; recuperouAlgo=true; }
      } else {
        state[key].push(item); recuperouAlgo=true;
      }
    });
  });
  if(recuperouAlgo) console.warn('[backup local] alteração(ões) recente(s) não confirmada(s) na planilha foram recuperada(s) deste navegador.');
}
// Busca o estado mais recente da planilha (sem aplicar nada ainda) — usado antes de
// gravar, para sempre mesclar por cima da versão mais atual e nunca por cima de dados
// desatualizados que este cliente carregou há alguns segundos ou minutos.
async function buscarRemotoBruto(){
  try{
    const res=await fetch(SHEETS_URL,{method:'GET'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!data) return null;
    if(data.Solicitacoes) normalizarDatas(data.Solicitacoes,'data');
    if(data.Kanban){ normalizarDatas(data.Kanban,'data'); normalizarDatas(data.Kanban,'dataConclusao'); }
    if(data.Historico) normalizarDatas(data.Historico,'ts');
    if(data.Notificacoes) normalizarDatas(data.Notificacoes,'ts');
    return data;
  }catch(err){
    console.warn('Não foi possível buscar o estado mais recente da planilha antes de gravar (seguindo apenas com os dados locais):',err);
    return null;
  }
}
// Envia uma única aba para a planilha, com novas tentativas em caso de falha
// (evita perda de dados por instabilidade de rede ou concorrência no Apps Script).
// Importante: só é considerado sucesso se o HTTP responder OK *e* o corpo confirmar
// {ok:true} — o Apps Script pode devolver uma página de erro com status 200 quando algo
// dá errado (ex.: trava demorando demais), e um "sucesso" falso aqui era o que fazia um
// card recém-criado ser tratado como "já salvo" sem ter sido salvo de verdade — e, na
// sincronização seguinte, acabar sendo interpretado como excluído (por não estar na
// planilha) e sumir sem chance de recuperação.
async function postSheet(nome,dadosSheet,tentativas){
  tentativas = tentativas || 3;
  let ultimoErro=null;
  for(let i=0;i<tentativas;i++){
    try{
      const res=await fetch(SHEETS_URL,{ method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({sheet:nome,data:dadosSheet}) });
      const texto=await res.text();
      let corpo=null; try{ corpo=JSON.parse(texto); }catch(eParse){}
      if(!res.ok || !corpo || corpo.ok!==true) throw new Error('Resposta inesperada do Apps Script (HTTP '+res.status+'): '+texto.slice(0,300));
      lastSyncedHash[nome]=JSON.stringify(dadosSheet);
      return true;
    }catch(err){
      ultimoErro = (err&&err.message)?err.message:String(err);
      console.error('Erro ao salvar '+nome+' no Sheets (tentativa '+(i+1)+'/'+tentativas+'):',err);
      if(i<tentativas-1) await new Promise(r=>setTimeout(r,600*(i+1)));
    }
  }
  postSheet.ultimoErro = nome+': '+ultimoErro;
  return false;
}
function aplicarMesclagemNoEstado(mesclados){
  const antesUserId = state.currentUser?state.currentUser.id:null;
  state.solicitacoes = normalizarDatas(mesclados.Solicitacoes,'data');
  state.kanbanCards = normalizarDatas(normalizarDatas(mesclados.Kanban,'data'),'dataConclusao');
  state.historico = normalizarDatas(mesclados.Historico,'ts');
  state.notificacoes = normalizarDatas(mesclados.Notificacoes,'ts');
  state.usuarios = mesclados.Usuarios;
  garantirCodigosSolic(); garantirFlagVerTodas();
  nextSolicId=Math.max(nextSolicId,proximoId(state.solicitacoes));
  nextKanbanId=Math.max(nextKanbanId,proximoId(state.kanbanCards));
  nextNotiId=Math.max(nextNotiId,proximoId(state.notificacoes));
  nextHistId=Math.max(nextHistId,proximoId(state.historico));
  nextUserId=Math.max(nextUserId,proximoId(state.usuarios));
  if(antesUserId!=null){ const eu=state.usuarios.find(u=>u.id===antesUserId); if(eu) state.currentUser=eu; }
}
// Sincroniza: primeiro busca o estado mais atual da planilha, mescla registro a registro
// com o que temos localmente (só perde algo se dois usuários editarem o MESMO campo do
// MESMO registro quase no mesmo instante — nesse caso vence o mais recente) e só então
// grava. Cada aba alterada é enviada de uma vez (não em paralelo), evitando que gravações
// concorrentes no mesmo Apps Script se sobreponham.
async function syncAgora(){
  if(syncEmAndamento) return true;
  if(!haAlteracoesPendentes()) return true; // nada para enviar; quem traz novidades de outros usuários é o polling
  syncEmAndamento=true;
  setSyncStatus('syncing');
  let todasOk=true;
  try{
    Object.keys(CHAVE_ESTADO).forEach(nome=>atualizarVersoes(nome,arrayLocalDaAba(nome)));
    const remoto=await buscarRemotoBruto();
    const nomes=Object.keys(CHAVE_ESTADO);
    const mesclados={};
    nomes.forEach(nome=>{ mesclados[nome]=mesclarRegistros(arrayLocalDaAba(nome),remoto?remoto[nome]:null,registrosBase[nome],(nome==='Historico'||nome==='Notificacoes')?'desc':'asc'); });
    aplicarMesclagemNoEstado(mesclados);
    const paraEnviar=nomes.filter(nome=>JSON.stringify(mesclados[nome])!==lastSyncedHash[nome]);
    const falharam=new Set();
    for(const nome of paraEnviar){
      const ok=await postSheet(nome,mesclados[nome]);
      if(!ok){ todasOk=false; falharam.add(nome); }
    }
    // Só avança a "base" de comparação para abas realmente confirmadas na planilha
    // (gravadas agora com sucesso, ou que já estavam iguais ao servidor). Uma aba cuja
    // gravação falhou mantém a base antiga, para que a mudança continue sendo vista como
    // "pendente" e seja tentada de novo — nunca interpretada como uma exclusão.
    nomes.forEach(nome=>{ if(!falharam.has(nome)) registrarBase(nome,mesclados[nome]); });
    if(paraEnviar.length) render();
  }catch(err){
    console.error('Erro ao sincronizar com o Google Sheets:',err);
    todasOk=false;
    postSheet.ultimoErro=(err&&err.message)?err.message:String(err);
  }
  lastSyncTime=Date.now();
  syncEmAndamento=false;
  setSyncStatus(todasOk?'ok':'error', todasOk?null:postSheet.ultimoErro);
  return todasOk;
}
// Força a sincronização imediatamente (ignora o debounce de 700ms) e devolve uma
// Promise que resolve quando a gravação foi confirmada — usada em ações críticas
// como criar/editar usuário, para só fechar o modal depois de confirmar o salvamento.
function forcarSync(){
  clearTimeout(syncTimer);
  return syncAgora();
}
let ultimoErroSync=null;
function setSyncStatus(s,detalheErro){
  const eraOk = syncStatus!=='error';
  syncStatus=s;
  if(s==='error'&&detalheErro) ultimoErroSync=detalheErro;
  if(s==='ok') ultimoErroSync=null;
  const dot=document.getElementById('sync-indicator');
  if(dot){
    dot.className='sync-dot '+s;
    dot.title = s==='ok'?'Sincronizado — atualizando automaticamente em tempo real':s==='syncing'?'Sincronizando...':s==='error'?('Erro ao sincronizar (clique para ver detalhes) — nova tentativa automática em instantes'+(ultimoErroSync?': '+ultimoErroSync:'')):'—';
    dot.onclick = s==='error'?(()=>alert('Não foi possível sincronizar com o Google Sheets agora.\n\nDetalhe técnico: '+(ultimoErroSync||'(sem detalhe)')+'\n\nSuas alterações NÃO foram perdidas: elas continuam salvas neste navegador e o app vai tentar sincronizar de novo automaticamente. Se o problema persistir, verifique em Extensões > Apps Script > Execuções na planilha para ver o erro completo do lado do servidor.')):null;
    dot.style.cursor = s==='error'?'pointer':'default';
  }
  // Avisa com um toast só na TRANSIÇÃO para erro (não fica repetindo a cada nova tentativa) —
  // suas alterações continuam guardadas localmente e serão reenviadas automaticamente.
  if(s==='error'&&eraOk) showToast('Não foi possível sincronizar agora. Suas alterações estão salvas neste navegador e serão reenviadas automaticamente.');
  clearTimeout(retryTimer);
  if(s==='error'){ retryTimer=setTimeout(()=>{ if(dadosCarregados&&state.currentUser) syncAgora(); },8000); }
}

// ---------------- ATUALIZAÇÃO EM TEMPO REAL (POLLING) ----------------
// Busca periodicamente os dados mais recentes da planilha para que todos os usuários
// vejam solicitações, kanban, notificações e usuários atualizados espontaneamente, sem
// precisar sair e voltar a fazer login. Agora mescla registro a registro: uma edição
// local pendente em UM card não bloqueia mais a chegada de novidades sobre OUTROS cards
// (antes, a checagem era pela aba inteira, e era isso que fazia cards de outros usuários
// "sumirem" da tela até o usuário atual terminar de sincronizar sua própria edição).
async function atualizarEmTempoReal(){
  if(!state.currentUser||!dadosCarregados) return;
  if(pollEmAndamento||syncEmAndamento) return;
  if(document.hidden) return;
  if(Date.now()-lastSyncTime<3000) return; // dá tempo da planilha propagar uma gravação recém-feita
  pollEmAndamento=true;
  try{
    const data=await buscarRemotoBruto();
    if(!data){ pollEmAndamento=false; return; }
    Object.keys(CHAVE_ESTADO).forEach(nome=>atualizarVersoes(nome,arrayLocalDaAba(nome)));
    const nomes=Object.keys(CHAVE_ESTADO);
    const mesclados={};
    let mudou=false;
    nomes.forEach(nome=>{
      const merged=mesclarRegistros(arrayLocalDaAba(nome),data[nome],registrosBase[nome],(nome==='Historico'||nome==='Notificacoes')?'desc':'asc');
      mesclados[nome]=merged;
      if(JSON.stringify(merged)!==JSON.stringify(arrayLocalDaAba(nome))) mudou=true;
    });
    if(mudou){
      aplicarMesclagemNoEstado(mesclados);
      // Importante: a base só pode avançar para o que o SERVIDOR realmente tem (data[nome],
      // vindo direto do GET) — nunca para o resultado da mesclagem, que pode incluir edições
      // locais ainda não enviadas. Registrar essas edições como "confirmadas" aqui foi o que
      // fazia um card recém-movido, ainda não sincronizado, ser tratado como excluído assim
      // que o próximo ciclo não o encontrasse na planilha.
      nomes.forEach(nome=>registrarBase(nome,data[nome]||[]));
      render();
    }
  }catch(err){
    console.warn('Falha ao atualizar dados em tempo real (tentaremos novamente no próximo ciclo):',err);
  }finally{
    pollEmAndamento=false;
  }
}
function iniciarAtualizacaoAutomatica(){
  if(pollTimer) return;
  pollTimer=setInterval(atualizarEmTempoReal,6000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) atualizarEmTempoReal(); });
  window.addEventListener('online',()=>{ atualizarEmTempoReal(); if(haAlteracoesPendentes()) syncAgora(); });
  window.addEventListener('beforeunload',(e)=>{
    if(haAlteracoesPendentes()){ e.preventDefault(); e.returnValue=''; return ''; }
  });
}

document.getElementById('app').innerHTML='<div class="login-wrap"><div class="login-card" style="text-align:center;color:var(--ink-soft);font-weight:600;">Carregando dados...</div></div>';
carregarDados();
</script>
